e\" dialog shows up.\n\nDevice info:\n- Device: Pixel 7a\n- OS: Android kernel 6.1.167, GrapheneOS release 2026042101\n- App Version 2.3.1\n\n### Steps to reproduce the bug\n\n1. Open the Android app\n2. Find a paired device\n3. Long tap the paired device - the dialog \"Send message\" doesn't show up\n\n### Stacktrace\n\n_No response_\n\n### Screenshots and additional context\n\n_No response_", "llm": "long_press", "quote": "Long tap the paired device"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/jean-voila/FeurStagram/issues/99", "title": "[Bug]: Messages shortcut doesn't work", "body": "### Feurstagram version\n\nv437-0-0-33-78\n\n### Instagram version\n\n437.0.0.33.78\n\n### Affected area\n\nOther\n\n### Android version\n\n15\n\n### Device model\n\nBluefox NX1\n\n### APK type\n\nClassic APK\n\n### Installation source\n\nGitHub Releases\n\n### Device / APK architecture\n\narm64-v8a\n\n### What happened?\n\nWhen I try to create a shortcut on my launcher to the Messages shortcut target on this app, clicking the shortcut simply crashes, briefly showing a white screen before closing the app.\n\n### Steps to reproduce\n\n1. Add the app to your homescreen\n2. On the standard Android launcher, long-tap on Instagram and tap \"Messages\" (This step may be different on different launchers)\n4. Observe\n\n### Feurstagram settings\n\nThis was after a fresh install and login.\n\n### How often does it happen?\n\nAlways\n\n### Expected behavior\n\nUsing the Messages shortcut should always open the messages window, without crashing the app.\n\n### Screenshots, screen recordings, or logs\n\n_No response_", "llm": "long_press", "quote": "long-tap on Instagram and tap \"Messages\""}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/patzly/grocy-android/issues/913", "title": "Shortcuts broke in 3.8.1", "body": "I'm using a Google Pixel 6 Pro with Nova Launcher. With 3.8.1, the shortcuts (long-press the icon, then chose one of Purchase, Consume, Transfer, or Chores) don't work \u2014 they all just go to the main screen. I'm pretty sure they worked in 3.8.0.", "llm": "long_press", "quote": "long-press the icon"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/davideas/FlexibleAdapter/issues/676", "title": "Long click not recognized on Galaxy S8/S9 only if drag view with long click is enabled", "body": "I have been debugging this behavior for some days and I am finally at the conclusion that the bug is highly likely not to be in my code base:  \r\nI don't get any OnLongClick callbacks on the Galaxy S8 (probably S9, too). You can reproduce this behavior by running the FlexibleAdapter-demo app, once on an S8, once on any other phone.\r\n1. Open the example \"headers and sections\"\r\n2. Long click on the first item\r\n---> on the S8 there is **no** \"long click on xxx\" toast shown, on any other phone, the toast **is** shown\r\n\r\nSince the Galaxy phones represent a big part of the phone market, this is a big problem for us (and therefore for many other users of the library I suppose). It destroys one of our features and I cannot find any way to fix it.\r\nI am thankful for any advice!", "llm": "long_press", "quote": "Long click on the first item"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/mkulesh/microMathematics/issues/150", "title": "When a text fragment is selected manually and copied, a magnifier overlay still be visible", "body": "Observed on Android 16", "llm": "long_press", "quote": "When a text fragment is selected manually"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/mpiannucci/react-native-context-menu-view/issues/24", "title": "Pressables not working after context menu opened", "body": "When wrapping Pressables (`<Pressable>`, `<TouchableOpacity>`, ...) with a context menu, the entire JS responder system will fail/crash once you open the context menu once. In other words, your entire screen becomes unresponsive if you open a context menu that contains a pressable.\r\n\r\nThere might be some extra treatment required to support inlining the JS pressability API.\r\n\r\n(Also, it looks like native buttons such as the back button from react-native-navigation are still working, it's just the current screen that \"freezes\"/doesn't trigger onPress events anymore)\r\n\r\nhttps://user-images.githubusercontent.com/15199031/104899395-14d0a680-597b-11eb-9d4e-c851136042f7.mov\r\n\r\nCode:\r\n\r\n```jsx\r\nreturn (\r\n  <View style={styles.container}>\r\n    <ContextMenu onPress={onContextActionPressed} actions={ACTIONS}>\r\n      <Pressable style={styles.imageContainer} onPress={onImagePressed}>\r\n        <FastImage\r\n          style={styles.image}\r\n          source={imageSource}\r\n        />\r\n      <\/Pressable>\r\n    <\/ContextMenuView>\r\n  <\/View>\r\n);\r\n```\r\n", "llm": "long_press", "quote": "once you open the context menu once. In other words, your entire screen becomes unresponsive if you open a context menu that contains a pressable."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/martinmimigames/little-file-explorer/issues/65", "title": "Unable to delete any file", "body": "Unable to delete any file\r\n\r\n**Describe the bug**\r\nI am unable to delete any file with this app. Files open OK, just can not delete them\r\n\r\n**To Reproduce**\r\nSteps to reproduce the behaviour:\r\nLong press a file, either on internal phone storage or external SD Card to select and highlight it. Select delete in dialogue screen. Dialogue screen disappears but nothing else happens, file is not deleted and no error messages. \r\n\r\n\r\n**Expected Behaviour**\r\nSelecting a file to delete should result in file being deleted\r\n\r\n**[Optional] Versioning  information**\r\nSamsung note 4 SM-N910C\r\n6.0.1 Marshmallow\r\n128 Mb SD Card\r\nVersion 4.13 Little File Explorer\r\n\r\n\r\n**[Optional] Additional information**\r\nI've looked at basic things like file permissions just in case that being an issue, however Little File Explorer has permisison to access storage and I not sure what else it may be.\r\n\r\n\r\nThank you ", "llm": "long_press", "quote": "Long press a file"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/VinylMusicPlayer/VinylMusicPlayer/issues/1231", "title": "Crash when selecting an album that has no tracks", "body": "**Describe the bug**\nVinyl crashes when you select an empty album from the album list.\n\n**To reproduce**\nSteps to reproduce the behavior:\n1. Open the app. I start in Album view, and my library has some entries at the top called Unknown Album that each have 0 songs. I don't know how I got them, and I was hoping a long press would give more info.\n2. Long press on an empty Unknown Album.\n3. Crash\n\n**Expected behavior**\nThe empty album gets marked as selected.\n\n\n**Device info**\n\n App version: 1.11.0\nApp version code: 202\nAndroid build version: 2025112101\nAndroid release version: 16\nAndroid SDK version: 36\nAndroid build ID: 2025112101\nDevice brand: google\nDevice manufacturer: Google\nDevice name: bluejay\nDevice model: Pixel 6a\nDevice product name: bluejay\nDevice hardware name: bluejay\nABIs: [arm64-v8a, armeabi-v7a, armeabi]\nABIs (32bit): [armeabi-v7a, armeabi]\nABIs (64bit): [arm64-v8a]\n\n## Time: \n2025/11/27 17:38:09\n## Stack: \njava.lang.IllegalStateException: Two different ViewHolders have the same stable ID. Stable IDs in your adapter MUST BE unique and SHOULD NOT change.\n ViewHolder 1:ViewHolder{80df339 position=0 id=-1, oldPos=-1, pLpos:-1} \n View Holder 2:ViewHolder{433ada1 position=4 id=-1, oldPos=-1, pLpos:-1} com.simplecityapps.recyclerview_fastscroll.views.FastScrollRecyclerView{b9fbb3d VFED..... ......ID 0,0-1080,1785 #7f090282 app:id/recycler_view}, adapter:com.poupa.vinylmusicplayer.adapter.album.AlbumAdapter@59c9483, layout:androidx.recyclerview.widget.GridLayoutManager", "llm": "long_press", "quote": "Long press on an empty Unknown Album."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/dergigi/boris-android/issues/266", "title": "[Bug]: WYSIWYG editor: selection anchors broken on lines mixing CJK characters with inline URLs", "body": "### What happened?\n\n# Summary\n\nIn Boris Android, selecting text on a line that combines Chinese/Japanese/Korean (CJK) characters with an inline URL produces broken selection start/end positions. The visible selection doesn't match the intended anchors, making precise selections in that line unreliable.\n\n# Actual behavior\nThe selection's beginning and/or end are displaced. the highlighted text doesn't match the intended range, and subsequent edits corrupt the wrong positions.\n\n<img width=\"1080\" height=\"614\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/945bb227-22a7-44da-8aaf-731075da92d3\" />\n\n### Steps to reproduce\n\n1. Open the following article in the editor: https://lucumr.pocoo.org/2026/9/7/astra-why/ (\"Astra for Coding: Why Are We Doing This Again?\")\n2. Scroll to the affected line \u2014 it's visible near the top of the page without scrolling.\n3. Attempt to select text starting or ending inside that mixed line (tap-and-drag across the range including both the CJK text and URL)\n\n### Expected behavior\n\nSelection start and end positions correspond exactly to the tap/drag anchors chosen by the user.\n\n### App version\n\n1.6.19 (org.dergigi.boris)\n\n### Android version\n\n14\n\n### Device\n\n_No response_\n\n### Extra context\n\n_No response_", "llm": "long_press", "quote": "Attempt to select text starting or ending inside that mixed line (tap-and-drag across the range including both the CJK text and URL)"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Elnix90/Dragon-Launcher/issues/452", "title": "[BUG] Double Tap not working.", "body": "### Requirements\n\n- [x] I have written the whole issue myself and I am not an AI Agent. Check [CONTRIBUTING.MD](https://github.com/Elnix90/Dragon-Launcher?tab=contributing-ov-file) for more info\n- [x] I checked for duplicate issues in both opened and closed\n- [x] I updated the app to the latest version and searched in the whole app / asked if the feature isn't already implemented\n- [ ] I updated the app to the latest beta version to test and searched in the whole app / asked if the feature isn't already implemented\n- [ ] I haven't read those requirements\n\n### Description\n\nDouble Tap no longer opens the App Drawer (the selected function). \n\n### Steps to Reproduce\n\n1. Double tap on screen. \n2. Expected result: App Drawer opens. \n3. Result: nothing happens. \n\n### Expected Behavior\n\nI have Double Tap set to open the App Drawer. \n\n### Actual Behavior\n\nNothing triggers. \n\n### Version\n\nV4. 4..0, Code Name: Smaug, Version Code: 68, Release: Stable\n\n### Device and version\n\nGoogle Pixel 7a\nOS: GOS 2026100201\n\n### Logs\n\n```shell\n\n```\n\n### Additional Context\n\n_No response_", "llm": "double_tap", "quote": "Double tap on screen."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/LanRhyme/ReveriePaint/issues/58", "title": "[BUG] \u4e25\u91cd\uff1a\u56fe\u5c42\u65e0\u6cd5\u70b9\u51fb\u6216\u6781\u96be\u70b9\u51fb", "body": "### \u5e94\u7528\u7248\u672c (App Version)\n\n1.4.1\n\n### \u8bbe\u5907\u4e0e\u7cfb\u7edf\u4fe1\u606f (Device & OS)\n\nOPPO Pad 3\n\n### \u624b\u5199\u7b14\u578b\u53f7 (Stylus Model)\n\n-\n\n### \u95ee\u9898\u8be6\u7ec6\u63cf\u8ff0\u4e0e\u590d\u73b0\u6b65\u9aa4 (Description & Reproduction Steps)\n\n1. \u7ed8\u753b\u9875\u9762\uff0c\u9009\u62e9\u56fe\u5c42\n2. \u90e8\u5206\u56fe\u5c42\u6781\u96be\u70b9\u5f00\uff0c\u4e5f\u65e0\u6cd5\u53cc\u51fb\u8fdb\u5165\u8bbe\u7f6e\n3. \u5373\u4f7f\u4fdd\u5b58\u5e76\u9000\u51fa\uff0c\u518d\u91cd\u65b0\u6253\u5f00\uff0c\u4ecd\u7136\u80fd\u590d\u73b0\u6b64\u95ee\u9898\n\n\u5de5\u7a0b\u6587\u4ef6\uff1a\n[\u672a\u547d\u540d\u4f5c\u54c1 9.revp.zip](https://github.com/user-attachments/files/33021499/9.revp.zip)\n\n### \u622a\u56fe\u6216\u5f55\u5c4f (Screenshots / Screen Recording)\n\nhttps://github.com/user-attachments/assets/662d33ac-2dcf-4d4a-b3b6-5f3cae79a1cd\n\n### \u65e5\u5fd7\u6216\u5d29\u6e83\u5806\u6808 (Logcat / Crash Log)\n\n```shell\n\n```\n\n### \u63d0\u4ea4\u786e\u8ba4 (Checklist)\n\n- [x] \u6211\u5df2\u5728\u73b0\u6709 Issue \u4e2d\u68c0\u7d22\uff0c\u672a\u53d1\u73b0\u76f8\u540c\u6216\u5df2\u89e3\u51b3\u7684\u91cd\u590d\u62a5\u544a\n- [x] \u6211\u4f7f\u7528\u7684\u662f\u5b98\u65b9 GitHub Release \u6216 Mirror\u9171\u6e20\u9053\u83b7\u53d6\u7684\u5b89\u88c5\u5305", "llm": "double_tap", "quote": "\u90e8\u5206\u56fe\u5c42\u6781\u96be\u70b9\u5f00\uff0c\u4e5f\u65e0\u6cd5\u53cc\u51fb\u8fdb\u5165\u8bbe\u7f6e"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/rama-io/mako/issues/142", "title": "Double Click does Double Things", "body": "### Checklist\n\n- [x]  I've checked that this bug is not already reported.\n- [x]  I'm using the latest version of Mako.\n- [x]  The title describes the bug clearly.\n\n### Android Version\n\nAndroid 16\n\n### Bug description\n\nWhen I click the screen twice, if there is an app on the left (which I'm not clicking the app, the rightest place on the screen I click) it does two thing, turn off the screen and open the app and when I unlocked my phone I see the app I 'opened' when I double clicked on the screen.\n\nBtw, I was sad to see I can't unlock my phone when I locked with double click BUT you guys made another update and added a new method and now it is fixed, thanks so much!\n\n### Steps to reproduce\n\n1. Double Click the turn off the screen\n2. Click when the app drawer is open on the side\n3. Even not clicking on the app, clicking the rightest place on the screen but if there is an app on the leftest on the screen\n4. It does turn off the screen and open the app at the same time\n\n### Additional information\n\nI love the work you guys are doing :)", "llm": "double_tap", "quote": "Double Click the turn off the screen"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/EdricChan03/studybuddy-android/issues/737", "title": "[Bug] `ModalBottomSheetFragment` doesn't persist items on configuration change", "body": "### Is there an existing issue for this?\n\n- [X] I have searched the existing issues\n\n### What happened?\n\nWhen performing a configuration change such as rotating the screen, the items in the [`ModalBottomSheetFragment`](https://github.com/EdricChan03/studybuddy-android/blob/2b56189da613569f683f4ba7d28634701e3bb056/ui/widgets/modal-bottom-sheet/src/main/kotlin/com/edricchan/studybuddy/ui/widgets/modalbottomsheet/views/ModalBottomSheetFragment.kt) are not persisted.\n\n### Expected behaviour\n\nItems should be persisted on config change\n\n### Reproduction steps\n\n1. Add items to the `ModalBottomSheetFragment`\r\n2. Show the bottom sheet\r\n3. Items are shown correctly\r\n4. Rotate the screen\r\n5. Items are no longer shown\n\n### Application variant\n\n_No response_\n\n### Application version\n\n_No response_\n\n### Application version code\n\n_No response_\n\n### Relevant log output\n\n_No response_\n\n### Possible solution\n\nA [ViewModel](https://developer.android.com/topic/libraries/architecture/viewmodel/viewmodel-savedstate) can be used, or the alternative methods as documented in [Saving UI State](https://developer.android.com/topic/libraries/architecture/saving-states).\n\n### Additional context\n\n_No response_", "llm": "orientation", "quote": "Rotate the screen"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/engindearing-projects/OmniTAK-Android/issues/272", "title": "Map partly black after the phone turns while another tab is open", "body": "On the 2D map: if the screen turns while the map is not the tab on screen, the map comes back drawn in a region the size of the old orientation and the rest of the map area is black. It happens on `main` today. Seen on the emulator only (Android 16, 1080 x 2400); not tried on a physical phone.\n\n## Steps (main at d1569ae, 0.45.0)\n\n1. Open the app on the Map tab with the phone in one orientation and auto-rotate on.\n2. Open another tab: Settings from the top-right menu button. (Chat, Servers and Mesh should do the same; I used Settings.)\n3. Turn the phone to the other orientation. On the emulator: `adb emu rotate`.\n4. Tap the Map tab.\n\nExpected: the map fills the screen, as it does when the phone is turned with the map open.\nActual: the map is drawn in a stale-sized region and the rest of the map area is black.\n\n## What I measured\n\n- Phone landscape, then Settings, then three quarter turns back to upright, then the Map tab: the map covers only a band at the top and 64.4% of the map area is black (screenshot `214-main-map-after-turn-while-on-settings.png`, 1080 x 2400).\n- Turning the phone with the map open is fine (`214-main-landscape-after-turn.png`: full landscape map, contacts in place).\n- Turning the phone again with the broken map on screen repairs it (black share back to 1%). Panning does not.\n- Each time, logcat has this line:\n  `E/BLASTBufferQueue: [SurfaceView[soy.engindearing.omnitak.mobile/soy.engindearing.omnitak.mobile.MainActivity]#4](f:0,a:0) rejecting buffer:acti", "llm": "orientation", "quote": "Turn the phone to the other orientation. On the emulator: `adb emu rotate`."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/engindearing-projects/OmniTAK-Android/issues/207", "title": "Landscape: settings screens without a scroll container are unusable", "body": "Source: field report from @realH0man after a 50+ operator MilSim event (September 2026), OmniTAK Android 0.43.x on multiple phones, Meshtastic firmware 2.5.x / 2.7.x / 2.8.0. Relayed from email.\n\n## Symptom\nIn landscape, some settings screens become unusable: content runs off the bottom and does not scroll, so buttons cannot be reached.\n\n## Cause\nLandscape handling exists only for the map and the tools drawer. Some settings-family screens have no scroll container at all (`AboutScreen.kt` and `OnvifCameraScreen.kt` have neither `verticalScroll` nor `LazyColumn`); others may clip fixed-height sections.\n\n## Fix\nAudit every settings-family screen on a phone in landscape. Wrap content in `verticalScroll`, keep primary actions reachable, and add a landscape screenshot to the release checklist.\n", "llm": "orientation", "quote": "In landscape, some settings screens become unusable"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/thecosmicfrog/LuasataGlance/issues/6", "title": "App occasionally crashes when screen is rotated many times in a short space of time", "body": "When Luas at a Glance is open and the handheld device is rotated several times in a short space of time (causing the Activity to redraw many times), the app occasionally crashes.\n", "llm": "orientation", "quote": "rotated several times in a short space of time"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/elimu-ai/appstore/issues/121", "title": "When rotating device, the progressbar disappears [4-8h]", "body": "When rotating from landscape mode to portrait (or vice versa) after starting a download, the progressbar disappears. But the download continues in the background.\r\n\r\nFix so that the progressbar remains active after rotating the the device.", "llm": "orientation", "quote": "When rotating from landscape mode to portrait (or vice versa)"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/PnX-SI/gn_mobile_occtax/issues/278", "title": "[2.7.1] Probl\u00e8me rotation des photos prises en mode portrait", "body": "### Version de l'application\r\n\r\nVersion d'Occtax-mobile affect\u00e9e par le bug : 2.7.1\r\nVersion de GeoNature utilis\u00e9e : 2.14\r\n\r\n### Terminal et Version Android\r\n\r\nMarque et mod\u00e8le du terminal : Pixel6A me.c) is a JNI native method that runs `while (1)` and almost never returns. Each log line calls `CStr2Jstring`, which creates several JNI local references (`FindClass`, `NewStringUTF`, `NewByteArray`, `NewObject`) and does not `DeleteLocalRef` any of them. The returned `jstring` is also not deleted after `CallStaticVoidMethod`.\n\nJNI local refs are only released when the native method returns. This method does not return, so the table grows without bound. Android\u2019s default local reference table is about 512 entries. A few dozen stdout lines are enough to hit:\n\n`JNI ERROR: local reference table overflow`\n\n**To Reproduce**\n\nFrom the code path (no runtime log attached):\n\n1. Java calls `LoadMe.redirectStdio()` (stdio redirect in the boat/Minecraft child process).\n2. Native code creates a pipe, `dup2`s stdout/stderr, then enters `while (1)` and `read()`s the pipe.\n3. Each non-empty chunk is passed to `CStr2Jstring` and then `LoadMe.receiveLog`.\n4. Local refs accumulate until the JNI local reference table overflows.\n\n`CStr2Jstring` (intermediates never deleted; only the `NewObject` result is returned):\n\n```c\njclass strClass = (*env)->FindClass(env, \"java/lang/String\");\njstring encoding = (*env)->NewStringUTF(env, \"UTF-8\");\njbyteArray bytes = (*env)->NewByteArray(env, len);\nreturn (jstr", "llm": "none", "quote": "Java calls `LoadMe.redirectStdio()`"}, {"list": "to_verify_sample_none100", "kind": "trigger", "url": "https://github.com/cloud-emoticon/cloudemoticon-android/issues/7", "title": "\"Only show in notification panel\" won't work on Android 2.x", "body": "", "llm": "none", "quote": "\"Only show in notification panel\" won't work"}, {"list": "to_verify_sample_none100", "kind": "trigger", "url": "https://github.com/alexvasilkov/GestureViews/issues/136", "title": "Memory leak in ViewPositionHolder", "body": "It seem there is a memory leak when using `GestureViews`.\r\n\r\n`ViewPositionAnimator `contains a `fromPosHolder` and a `toPosHolder` was observed for those a", "llm": "none", "quote": "1. Add/select a self-hosted HTTPS Dashboard advertising `cookie` and `native_pkce` with a password provider.\n2. Start Dashboard sign-in in Relay and submit valid credentials in the browser.\n3. Authentication is accepted, but Relay never completes sign-in."}, {"list": "to_verify_sample_none100", "kind": "trigger", "url": "https://github.com/camellia2077/FlipBits/issues/3", "title": "Android Mini playback speed switching still has audible click | Android Mini \u64ad\u653e\u500d\u901f\u5207\u6362\u65f6\u4ecd\u80fd\u542c\u89c1 click", "body": "## English\n\n### Problem\n\nWhen playing Mini/CW audio on Android, switching playback speed during active playback can still produce an audible click or click-like artifact.\n\nThis is most noticeable when switching between slow playback speeds such as `1.0x`, `0.75x`, `0.5x`, `0.25x`, and `0.1x`.\n\n### User impact and priority\n\nThis is currently **not considered a high-priority blocker**.\n\nThe main use case for low-speed playback is to choose a fixed slow speed and listen carefully. Users who switch to slow playback usually want to understand the audio more clearly, not repeatedly toggle between speeds.\n\nSo while it would be ideal for all speed switching to be completely artifact-free, the more important current requirements are:\n\n- slow playback can be recorded;\n- fixed-speed slow playback works;\n- Mini/CW Dit/Dah ending clicks are reduced.\n\n### What has already been fixed\n\nWe have already fixed or improved several related issues:\n\n- Added a Mini/CW tone envelope to reduce Dit/Dah ending clicks.\n- Applied the same envelope in both:\n  - core Mini/CW audio generation;\n  - Android Mini/CW slow-speed PCM renderer.\n- Slow playback remains recordable because it still uses rendered PCM rather than only AudioTrack playback speed.\n\n### Fixes already attempted for speed-switch click\n\nSeveral approaches were tried for the speed-switching click:\n\n- Added playb cks a format from `cameraInfo.allFormats`, which is only filled by\n   `CameraInfo.rebind()` after the capture session has started.\n3. `CameraViewController.viewWillAppear` starts the session later, asynchronously on the camera\n   queue (`cameraSession.startCamera()`).\n4. So at the time of the first `update`, `allFormats` is empty: `CameraFormatPicker.getBestFormatByOrder`\n   returns null and `selectBestFormatByOrder` returns without doing anything. The state is still\n   updated with the requested `CamFormat`, so every later `update` with the same value is treated\n   as \"no change\" and the format is never retried.\n\nConfirmed on device: ", "llm": "not_gui", "quote": "On iOS, the `camFormat` given to `CameraPreview` at composition has no effect"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/wagenknecht/backloggd-android-app/issues/8", "title": "Build Error: Can't find Monochrome icon", "body": "Not sure how the dev built the apk with missing monochrome files\n\nError Log:\n```\nC:\\Users\\InternetNinja\\Downloads\\Compressed\\Backloggd-Android-App-master>gradlew.bat assembleDebug\n> Task :app:processDebugResources FAILED\n\nFAILURE: Build failed with an exception.\n\n* What went wrong:\nExecution failed for task ':app:processDebugResources'.\n> A failure occurred while executing com.android.build.gradle.internal.res.LinkApplicationAndroidResourcesTask$TaskAction\n   > Android resource linking failed\n     ERROR: C:\\Users\\InternetNinja\\Downloads\\Compressed\\Backloggd-Android-App-master\\app\\src\\main\\res\\mipmap-anydpi-v26\\ic_launcher.xml:5: AAPT: error: resource mipmap/ic_launcher_monochrome (aka de.wagenknecht.backloggd:mipmap/ic_launcher_monochrome) not found.\n\n     ERROR: C:\\Users\\InternetNinja\\Downloads\\Compressed\\Backloggd-Android-App-master\\app\\src\\main\\res\\mipmap-anydpi-v26\\ic_launcher_round.xml:5: AAPT: error: resource mipmap/ic_launcher_monochrome (aka de.wagenknecht.backloggd:mipmap/ic_launc .MutableTaskContainer.getPreBuildTask(MutableTaskContainer.kt:63)\n\tat com.android.build.gradle.tasks.JavaCompileCreationAction.configure(JavaCompile.kt:112)\n\tat com.android.build.gradle.tasks.JavaCompileCreationAction.configure(JavaCompile.kt:", "llm": "not_gui", "quote": "A Gradle sync in IntelliJ produces the error"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/appium/java-client/issues/2124", "title": "bug: IllegalAccessError when starting AndroidDriver in Appium 9.1.0", "body": "### Do I have the most recent component updates?\n\n- [X] I use the most recent available driver/plugin and server versions\n\n### Is the component officially supported by the Appium team?\n\n- [X] I have verified the component repository is present under the Appium organization in GitHub\n\n### Is there an existing issue for this?\n\n- [X] I have searched the existing issues\n\n### Current Behavior\n\nUsing libs:\r\n`io.appium:java-client:9.1.0`\r\n`org.seleniumhq.selenium:selenium-java:4.17.0`\r\n\r\nWhen start the android driver it throws IllegalAccessError.\r\n\r\n<pre>\r\nStacktrace:\r\n`java.lang.IllegalAccessError: class io.appium.java_client.remote.AppiumNewSessionCommandPayload tried to access method 'java.util.stream.Collector com.google.common.collect.ImmutableMap.toImmutableMap(java.util.function.Function, java.util.function.Function)' (io.appium.java_client.remote.AppiumNewSessionCommandPayload and com.google.common.collect.ImmutableMap are in unnamed module of loader 'app')\r\n\r\n\tat io.appium.java_client.remote.AppiumNewSessionCommandPayload.makeW3CSafe(AppiumNewSessionCommandPayload.java:40)\r\n\tat io.appium.java_client.remote.AppiumNewSessionCommandPayload.<init>(AppiumNewSessionCommandPayload.java:54)\r\n\tat io.appium.java_client.AppiumDriver.startSession(AppiumDriver.java:268)\r\n\tat org.openqa.selenium.remote.RemoteWebDriver.<init>(RemoteWebDriver.java:162)\r\n\tat io.appium.java_client.AppiumDriver.<init>(AppiumDriver.java:90)\r\n\tat io.appium.java_client.AppiumDriver.<init>(AppiumDriver.java:102)\r", "llm": "not_gui", "quote": "IllegalAccessError when starting AndroidDriver in Appium"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/mobiledevpro/closetalk.app/issues/20", "title": "Issue with Koin scopes: ViewModel is initialized as many times as composable recomposes", "body": "The correct usage of Koin \r\n\r\n![image](https://github.com/mobiledevpro/Jetpack-Compose-ChatApp-Template/assets/5750211/33a8f1b5-0606-4423-9d48-fae964f3396d)\r\n", "llm": "not_gui", "quote": "Issue with Koin scopes: ViewModel is initialized as many times as composable recomposes"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/nextcloud/Android-SingleSignOn/issues/541", "title": "Instantiating `Void` does no longer work with AGP 8", "body": "We implemented [a hacky way to instantiate `Void` using reflection](https://github.com/nextcloud/Android-SingleSignOn/commit/e19aae1cc0f124cc58f9dbc726413ddb6de7ffc6). This does no longer work with new Java versions and encumbers users while upgrading to AGP 8 and newer Java versions.\r\n\r\nWhy did we implement this at all? See [comment](https://github.com/nextcloud/Android-SingleSignOn/issues/541#issuecomment-1893453525), TLDR; Using REST endpoints that return an empty body as `Observable<Void>` leads to a crash. (See https://github.com/nextcloud/Android-SingleSignOn/issues/231).\r\n\r\nCC @desperateCoder @David-Development @AndyScherzinger @tobiasKaminsky ", "llm": "not_gui", "quote": "Instantiating `Void` does no longer work with AGP 8"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/runningcode/fladle/issues/140", "title": "Duplicate status messages", "body": "**Describe the bug**\r\nRunning flank using fladle gives duplicated messages on output. \r\n\r\n**Details**\r\nFlank provides 3 different types of output style [single, multi, verbose]. `--output-style=multi` is default when flank is running more than one execution. It is using ANSI codes to overwrite multiple lines in output. Some consoles may not supports ANSI codes so it can results with duplicated messages. Also running flank through gradle may give same results.\r\n\r\n**To reproduce**\r\nRun fladle with `max-test-shards`  > 1. It's important to have more than one shard. The expected result was pasted in issue https://github.com/Flank/flank/issues/841.\r\n\r\n**Additional context**\r\n* `--output-style=multi` displays separated status for each shard execution in separated line, lines are updated over time. Similar to gradle output when running multiple tasks in parallel. Requires ANSI codes support.\r\n* `--output-style=single` displays shortened status of all executions in single line. Similar to gcloud output when running with sharding. Should work on any console.\r\n\r\n**Possible solutions**\r\n* Add option `output-style` to fladle so users can specify which one they want.\r\n* Add `output-style=single` to executions under the hood so all executions on fladle will display single output.", "llm": "not_gui", "quote": "Running flank using fladle gives duplicated messages on output. Run fladle with `max-test-shards` > 1."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/uber/okbuck/issues/375", "title": "OkBuck generates incorrect Buck file with test artifact", "body": "Dependencies.gradle:\r\n```\r\next.deps = [\r\n    dagger2: [\r\n        dagger2: \"com.google.dagger:dagger:2.8\",\r\n        dagger2compiler: \"com.google.dagger:dagger-compiler:2.8\",\r\n        dagger2Test: \"com.google.dagger:dagger:2.8:tests\"\r\n    ]\r\n]\r\n```\r\n\r\nApp module dependencies:\r\n```\r\n  compile project(':app-library')\r\n\r\n  compile deps.dagger2.dagger2\r\n  annotationProcessor deps.dagger2.dagger2compiler\r\n  testCompile deps.dagger2.dagger2Test\r\n```\r\nLibrary module dependencies:\r\n```\r\n  compile deps.dagger2.dagger2\r\n  annotationProcessor deps.dagger2.dagger2compiler\r\n```\r\n\r\nThe library module's generated Buck file:\r\n```\r\ndeps = [\r\n   '//.okbuck/cache:com.google.dagger.dagger-2.8-tests.jar',\r\n]\r\n```\r\nDagger's test artifact is used in the library module instead of the main dagger artifact.\r\n\r\nThis line:\r\n```//.okbuck/cache:com.google.dagger.dagger-2.8-tests.jar```\r\nshould instead be:\r\n```//.okbuck/cache:com.google.dagger.dagger-2.8.jar```\r\n\r\nRepro project: https://github.com/cwoodwar6/okbuck-test-project", "llm": "not_gui", "quote": "OkBuck generates incorrect Buck file with test artifact"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/libgdx/libgdx/issues/7825", "title": "ANGLE backend wrong scaling used on macOS with dual screens", "body": "### Describe the bug\n\nWhen using the ANGLE backend on macOS with a certain monitor configuration, the render area is always only 1/4rd of the screen - which can't be adjusted in any way as this is the entire accessible render area.\n\nThis only happens when using ANGLE. A workaround is to drag the window onto the other monitor and back as this triggers the window content scale which is probably handled by ANGLE.\n\nAs far as I can tell the issue might be in angle itself, but I wanted to open this anyway for tracking.\n\nIf you have any ideas for a code-based workaround without dragging the window around I would also highly appreciate it!\n\n### Reproduction\n\n1. You need a dual monitor setup where one monitor has a content scale of 1, and the other of 2.\nFor example when using a 1080p monitor and an iPad as secondary display, or a 1080p monitor on a retina macbook\n2. The window needs to open on the monitor with the content scale of 1 (the 1080p monitor)\n3. Resize the window by any amount\n\n\nThe content will now jump to the bottom left corner and stay there\n\nTo \"fix\" the issue drag the screen onto the other monitor and back\n\nThis should work with any libgdx project using angle, tested with default project.\n\nHere is a video demonstrating the issue:\n\nhttps://github.com/user-attachments/assets/a5642570-d004-4aa6-8cbd-9c9202fdaa2a\n\n### version\n\n1.14.2\n\n### Stack trace\n\n```shell\n\n```\n\n### Affected platforms\n\n- [ ] Android\n- [ ] iOS\n- [ ] HTML/GWT\n- [ ] Windows\n- [ ] Linux\n- [x] macOS", "llm": "not_gui", "quote": "Affected platforms: macOS"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/soot-oss/SootUp/issues/1382", "title": "[Bug]: java.lang.OutOfMemoryError for JavaSootClass getMethods()", "body": "### What happened?\n\nI tried to analyze the [LinkDroid for Linkwarden](https://f-droid.org/en/packages/com.sbv.linkdroid/) APK v2.1.2 from F-Droid. Extracting the information with the following code:\n```java\n\nList<BodyInterceptor> bodyInterceptors = new ArrayList<>();\nbodyInterceptors.addAll(DexBodyInterceptors.Default.bodyInterceptors());\nbodyInterceptors.addAll(BytecodeBodyInterceptors.Default.getBodyInterceptors());\n\nAnalysisInputLocation inputLocation = new ApkAnalysisInputLocation(apk_path, jar_path, bodyInterceptors);\nthis.view = new JavaView(inputLocation);\n```\nThis worked, but when i iterated over the classes and found the class **androidx.collection.ScatterSet$SetWrapper$iterator$1**, getMethods() crashed my program due to a java.lang.OutOfMemoryError. I think there may be an endless loop.\n\nWhen i manually removed the BodyInterceptor: TypeAssigner, it did not crash.\n\n\n### Version\n\nsootUp 2.0.0\n\n### Relevant log output\n\n```shell\nException in thread \"main\" java.lang.OutOfMemoryError: Java heap space\n        at java.base/java.util.HashMap.newNode(HashMap.java:1909)\n        at java.base/java.util.HashMap.putVal(HashMap.java:637)\n        at java.base/java.util.HashMap.put(HashMap.java:618)\n        at java.base/java.util.HashSet.add(HashSet.java:229)\n        at sootup.interceptors.typeresolving.TypeChecker.caseAssignStmt(TypeChecker.java:181)\n        at sootup.core.jimple.common.stmt.JAssignStmt.accept(JAssignStmt.java:229)\n        at sootup.core.jimple.common.stmt.JAssignS", "llm": "not_gui", "quote": "I tried to analyze the [LinkDroid for Linkwarden] APK v2.1.2 from F-Droid. Extracting the information with the following code: ... getMethods() crashed my program due to a java.lang.OutOfMemoryError."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/JuulLabs-OSS/mcumgr-android/issues/45", "title": "requiresDefragmentation in McuMgrResponse is lying", "body": "Check out combination of those 2 methods:\r\n\r\nhttps://github.com/JuulLabs-OSS/mcumgr-android/blob/4fbae4d92928abdab0a5d9911defa2baf381a919/mcumgr-core/src/main/java/io/runtime/mcumgr/response/McuMgrResponse.java#L272-L294\r\n\r\nThe `getExpectedLength(...)` returns expected length of the packet including header (header length is added).\r\nHowever, `requiresDefragmentation(...)` deducts the header length in the comparison.", "llm": "not_gui", "quote": "Check out combination of those 2 methods: ... The `getExpectedLength(...)` returns expected length of the packet including header (header length is added). However, `requiresDefragmentation(...)` deducts the header length in the comparison."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/apollographql/apollo-kotlin-normalized-cache/issues/259", "title": "`MemoryCache` without `nextCache` seems to have a thread safety issue", "body": "I'm encountering a cache miss issue that occurs when sending multiple queries using the same `ApolloClient` whose store has only one `MemoryCache`. I suspect that this is because `MemoryCache` doesn't create a lock when `MemoryCache.nextCache` is not present. By adding a single-threaded context to the client using `ApolloClient.Builder.dispatcher()`, or guarding `ApolloCall<T>.execute()` using a mutex resolves this issue (tested manually by running the same logic ~200 times).\n\nI found that in apollographql/apollo-kotlin#5608, `MemoryCache` always uses a lock, but in apollographql/apollo-kotlin#5651, it conditionally creates the lock only when `nextCache` is present. Was there a design rationale for this change? Is `MemoryCache` intended to be used with other types of `NormalizedCache` always?", "llm": "not_gui", "quote": "I'm encountering a cache miss issue that occurs when sending multiple queries using the same `ApolloClient` whose store has only one `MemoryCache`."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/uber/okbuck/issues/610", "title": "OkBuck does not add resources on android_libraries", "body": "I've made a [sample case](https://github.com/thalescm/okbuck/tree/resources-test) on where it happens normally with gradle, but fails with buck (generated by okBuck).\r\n\r\nmain app resources are under `src/main/resources`, but okbuck does not add the respective parameters (`resources`, `resources_root`, etc...) on the `android_library` rule.\r\n\r\nTo check the behavior, just run:\r\n`./gradlew app:connectedDevDebugAndroidTest` (or any other flavor): Passes\r\n`./buckw test //app:instrumentation_demoDebug_test` (or any other flavor): Fails", "llm": "not_gui", "quote": "okbuck does not add the respective parameters (`resources`, `resources_root`, etc...) on the `android_library` rule."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/MegatronKing/StringFog/issues/36", "title": "Kotlin \u4e2d\u5982\u679c\u4f7f\u7528\u5177\u540d\u53c2\u6570\u529f\u80fd\uff0c\u4f1a\u51fa\u9519", "body": "Kotlin \u4e2d\u5982\u679c\u4f7f\u7528\u5177\u540d\u53c2\u6570\u529f\u80fd\uff0c\u4f1a\u51fa\u9519", "llm": "not_gui", "quote": "Kotlin \u4e2d\u5982\u679c\u4f7f\u7528\u5177\u540d\u53c2\u6570\u529f\u80fd\uff0c\u4f1a\u51fa\u9519"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/inovait/neatle/issues/15", "title": "Command class should be public", "body": "", "llm /github.com/SkillPanel/jfairy/issues/77", "title": "textproducer.word(int count) with 117 elements results in an empty response.", "body": "If you call the TextProducer class method word with exactly 117 items, you will receive an empty result back. \r\n\r\nSo the following example:\r\n\r\n    Faityr.create().textProducer().word(117);\r\n\r\nwill result in an empty string. This has to do with it being 117 words available in the internal representation of the words in TextProducerInternal is of size 117, wish results in the method in BaseProducer:\r\n\r\n    public <T> List<T> randomElements(List<T> elements, int count) {\r\n        Collections.shuffle(elements, this.random);\r\n        return elements.subList(0, count % elements.size());\r\n    }\r\n\r\nthe sublist will become 0, 117%117 = 0, so no result will be returned. This depends on the number of words available of course, but I assume that it's not the expected result wished for.", "llm": "not_gui", "quote": "If you call the TextProducer class method word with exactly 117 items, you will receive an empty result back. So the following example: Faityr.create().textProducer().word(117); will result in an empty string."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/simonalveteg/Minute-Launcher/issues/71", "title": "Use new Indication API to remove (or make custom?) ripple from homescreen", "body": "RippleTheme is deprecated and should be replaced with indication api somehow. Check if it's possible to have the ripple only affect the text and not the transparent background? \r\n\r\n", "llm": "not_gui", "quote": "RippleTheme is deprecated and should be replaced with indication api somehow."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/Manabu-GT/DebugOverlay-Android/issues/254", "title": "[BUG] Missing logs in Network calls", "body": "We are using 2.6.1 sdk version. We are not seeing all network calls in comparision with Chucker network interceptor. Especially some post calls are missing.\n", "llm": "not_gui", "quote": "Missing logs in Network calls"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/kiitdev/kiit/issues/166", "title": "[Entities]: Minimize setup and dependencies", "body": "## Overview\r\nMinor clean-up to Entities/ORM component to minimize set up of entities and dependencies on other components. \r\n\r\n## Details\r\n1. ORM Builder: add function to build mapper\r\n2. ORM Builder: add function to build repo\r\n3. Entities: Reduce scope of Entities component so that it doesn't have to work as a DI/EntityService creator ( off load this type of creation to the caller so they can use their own type of DI / Service Locator component like Koin / Dagger )\r\n4. ApiBaseEntity: Have the EntityServie[Id,T] supplied in directly instead of creating it via the Entities component ( also to avoid being responsible for creation )\r\n\r\n", "llm": "not_gui", "quote": "Minor clean-up to Entities/ORM component to minimize set up of entities and dependencies on other components."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/PatilShreyas/debroid/issues/55", "title": "Fix potential hang in DefaultCommandRunner on process stream reading before timeout", "body": "### Problem Description\nIn `AdbManager.kt:19-20`:\n```kotlin\nval output = process.inputStream.bufferedReader().readText().trim()\nval exited = process.waitFor(timeoutSeconds, TimeUnit.SECONDS)\n```\n`process.inputStream.bufferedReader().readText()` runs synchronously on the calling thread and blocks until EOF before `process.waitFor(timeoutSeconds, ...)` is reached.\n\nIf an `adb` command or subprocess hangs without closing standard output/error, the timeout check is never reached and the CLI process hangs indefinitely.\n\n### Proposed Solution\nConsume the process input/error stream asynchronously on a background thread during `waitFor`, or read after ensuring the process has completed within the timeout window.", "llm": "not_gui", "quote": "In `AdbManager.kt:19-20`: `process.inputStream.bufferedReader().readText()` runs synchronously on the calling thread and blocks until EOF before `process.waitFor(timeoutSeconds, ...)` is reached."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/Rapsssito/react-native-background-actions/issues/201", "title": "BackgroundActions.stop does not terminate ongoing task", "body": "stop not working \r\n\r\n```\r\nimport BackgroundActions from 'react-native-background-actions';\r\nimport { DeviceEventEmitter } from 'react-native';\r\n\r\n/**\r\n * Class BackgroundTaskManager is designed to manage background tasks using\r\n * react-native-background-actions. However, the task started by scheduleTask\r\n * does not stop when finish is called.\r\n */\r\nclass BackgroundTaskManager {\r\n  static instance = null;\r\n  static iteration = 0;\r\n  static backgroundTaskId = null;\r\n\r\n  constructor() {\r\n    if (!BackgroundTaskManager.instance) {\r\n      BackgroundTaskManager.instance = this;\r\n      BackgroundTaskManager.resetInit();\r\n      console.log('BackgroundTaskManager initialized');\r\n    }\r\n\r\n    return BackgroundTaskManager.instance;\r\n  }\r\n\r\n  /**\r\n   * Resets the task manager and clears any existing background task configuration.\r\n   */\r\n  static resetInit() {\r\n    this.configArgsiOS = null;\r\n    this.configStartFunction = null;\r\n    this.configTimeoutFunction = null;\r\n    this.task = null;\r\n    this.options = null;\r\n    this.iteration++;\r\n    console.log('BackgroundTaskManager reset');\r\n  }\r\n\r\n  /**\r\n   * Configures the task manager with provided arguments.\r\n   */\r\n  static async configure(...args) {\r\n    BackgroundTaskManager.resetInit();\r\n    console.log('Configuring with args:', args);\r\n    this.configArgsiOS = args;\r\n    if (this.configStartFunction === null) {\r\n      this.configStartFunction = args[1];\r\n    }\r\n    this.configTimeoutFunction = args[2];\r\n    console.log('Configurat", "llm": "not_gui", "quote": "BackgroundActions.stop does not terminate ongoing task"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/LFDT-web3j/web3j/issues/1989", "title": "Incorrect address returned from `signedPrefixedMessageToKey` when invalid data passed in", "body": "# Incorrect address returned from `signedPrefixedMessageToKey` when invalid data passed in\r\n\r\n## Steps To Reproduce\r\nThere are two ways to get incorrect address returned from `signedPrefixedMessageToKey`\r\n1. invalid signature hash\r\n2. invalid message\r\n\r\n```java\r\npublic static String getAddressUsedToSignHashedMessage(String signedMessageInHex, String originalMessage)\r\n   throws SignatureException {\r\n        if (signedMessageInHex.startsWith(\"0x\")) {\r\n            signedMessageInHex = signedMessageInHex.substring(2);\r\n        }\r\n\r\n        // No need to prepend these strings with 0x because\r\n        // Numeric.hexStringToByteArray() accepts both formats\r\n        String r = signedMessageInHex.substring(0, 64);\r\n        String s = signedMessageInHex.substring(64, 128);\r\n        String v = signedMessageInHex.substring(128, 130);\r\n\r\n        // Using Sign.signedPrefixedMessageToKey for EIP-712 compliant signatures.\r\n        String pubkey = Sign.signedPrefixedMessageToKey(originalMessage.getBytes(),\r\n                new Sign.SignatureData(\r\n                        Numeric.hexStringToByteArray(v)[0],\r\n                        Numeric.hexStringToByteArray(r),\r\n                        Numeric.hexStringToByteArray(s)))\r\n                .toString(16);\r\n\r\n        return Keys.getAddress(pubkey);\r\n}\r\n    \r\nSign.SignatureData signatureData = Sign.signPrefixedMessage(myMsg.getBytes());\r\nbyte[] signedMessageBytes = new byte[32 + 32 + 1]; // 32 bytes for r, 32 bytes for s, 1 byte for v\r\nSystem.arra", "llm": "not_gui", "quote": "There are t that maps all classes packaged into the artifact.\r\n\r\nHowever, this is not right. All artifacts are not self-contained. There could be platform/SDK classes for which we have the references but are not contained in the artifact. For example, `android.app.DialogFragment` is one. The bundled APK may contain a reference to this class, but `eureka` cannot access the class file. In this case, it is not possible to traverse its ancestral origin. The same applies to classes referenced from the Java runtime.\r\n\r\nDue to this limitation, we end up in situations where users are presented with incomplete and misleading information. We have to mitigate or acknowledge this problem to the users.\r\n\r\nHere are some potential first steps,\r\n\r\n1. Print debugging information during development to see the number of classes to which we don't have access.\r\n2. Instead of returning a single tree, return all orphaned trees as the parse result and print these roots before starting the server.", "llm": "not_gui", "quote": "One of the assumptions I had while building the `hierarchy` subcommand feature was that all inheritance hierarchies within an artifact could be traced back to `java.lang.Object` as the root object."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/open-keychain/open-keychain/issues/2033", "title": "cursor error during key refresh", "body": "```\r\nA key could not be imported during multi-threaded import\r\njava.util.concurrent.ExecutionException: java.lang.IllegalStateException: Couldn't read row 0, col 0 from CursorWindow.  Make sure the Cursor is initialized correctly before accessing data from it.\r\nat java.util.concurrent.FutureTask.report(FutureTask.java:94)\r\nat java.util.concurrent.FutureTask.get(FutureTask.java:164)\r\nat org.sufficientlysecure.keychain.operations.ImportOperation.multiThreadedKeyImport(ImportOperation.java:506)\r\nat org.sufficientlysecure.keychain.operations.ImportOperation.execute(ImportOperation.ja r in any folders specified in the PATH environment variable (/usr/bin:/bin:/usr/sbin:/sbin)`. After Timeout I get this:\r\n```\r\n[The local appium server has not been started, Reason: Timed out waiting for [http://127.0.0.1:4723/status] to be available \r\nafter 20003 ms, Consider increasing the server startup timeout value (currently 20000ms), Node.js executable path: \r\n/usr/local/bin/node, Arguments: [/opt/homebrew/bin/appium, --port, 4723, --address, 127.0.0.1, --log, \r\n/Users/[user]/Projects/povio-automated-qa/target/resources/appium_server_logs1, --session-override], Output: [Appium] \r\n'npm' executable is not found neither in the process working folder (/Users/mmeholli/Projects/povio-automated-qa) nor in any \r\nfolders specified in the PATH environment variable (/usr/bin:/bin:/usr/sbin:/sbin)\r\n]\r\n```\r\n\r", "llm": "not_gui", "quote": "I wanted to upgrade from Appium 1.x to Appium 2.x+ but have been facing an issue when trying to run the appium server from the code."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/yuyakaido/CardStackView/issues/228", "title": "onCardSwiped always returns bottom?", "body": "so how can i judge which direction the previous card swiped?", "llm": "not_gui", "quote": "onCardSwiped always returns bottom?"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/braze-inc/braze-react-native-sdk/issues/328", "title": "Confirming external_id \u2194 APNs token linkage on iOS after account switching", "body": "### Which Platforms?\n\niOS\n\n### Which React Native Version?\n\n0.81.4\n\n### Which @braze/react-native-sdk SDK version?\n\n20.1.0\n\n### Repro Rate\n\n20%, just on 1 devices\n\n### Steps To Reproduce\n\nLog in several accounts across several devices, switching accounts on the\nsame device over time (logout \u2192 login). Then send push via `POST /messages/send`\ntargeting a specific list of `external_user_id`s, and observe which physical\ndevices actually receive the notifications versus which user is currently logged\nin on them.\n\n### Expected Behavior\n\nWhen an account switch happens on a device (logout \u2192 login \u2192 `changeUser`), the\ndevice's APNs token should be reassigned to the newly logged-in user, so that\ntargeting an `external_id` only reaches devices where that user is currently the\nowner of the token. A send targeting an old user should stop reaching a device\nonce another user has logged in on it.\n\n\n### Actual Incorrect Behavior\n\nI'd like to confirm my understanding of how `external_id` links to the APNs\ntoken on iOS, and ask for ways to inspect that association.\n\n---\n\n**1. Context**\n\n- I have multiple test accounts across multiple devices.\n- A backend batch job sends push via `POST /messages/send`, targeting an explicit\n  list of `external_user_id`s (UUIDs).\n- On login we call `Braze.changeUser(externalId)`.\n- Observed behavior across devices: after a user switch (logout A \u2192 login B),\n  sending to the OLD user A still reaches the device for a short window, then\n  stops after ~5\u201310 minutes, a", "llm": "not_gui", "quote": "Which Platforms? iOS"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/nhaarman/acorn/issues/40", "title": "StackNavigator.onStart is not idempotent", "body": "Calling StackNavigator.onStart multiple times causes listeners to receive the Scene notification again.", "llm": "not_gui", "quote": "Calling StackNavigator.onStart multiple times causes listeners to receive the Scene notification again."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/DrawAnywhere/DrawAnywhere/issues/26", "title": "It would be better if the size of the floating icon could be adjusted freely", "body": "It would be better if the size of the floating icon could be adjusted freely, so that it wouldn't block the icons below.", "llm": "not_gui", "quote": "It would be better if the size of the floating icon could be adjusted freely"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/Domi04151309/BatteryTool/issues/14", "title": "[Bug Report] F-Droid build failed, link error", "body": "```\r\n> Task :app:lintVitalRelease FAILED\r\n/home/vagrant/build/io.github.domi04151309.batterytool/app/src/main/res/values-it/strings.xml:66: Error: \"about_version\" is translated here but not found in default locale [ExtraTranslation]\r\n    <string name=\"about_version\">Versione %1$s<\/string>\r\n            ~~~~~~~~~~~~~~~~~~~~\r\n/home/vagrant/build/io.github.domi04151309.batterytool/app/src/main/res/values-it/strings.xml:69: Error: \"about_damage\" is translated here but not found in default locale [ExtraTranslation]\r\n    <string name=\"about_damage\">Non sono responsabile per eventuali danni al tuo dispositivo.<\/string>\r\n```\r\n\r\nCould you please take a look? Thanks!", "llm": "not_gui", "quote": "Task :app:lintVitalRelease FAILED /home/vagrant/build/.../strings.xml:66: Error: \"about_version\" is translated here but not found in default locale [ExtraTranslation]"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/socket-link/ampere/issues/901", "title": "Bug (B10) \u2014 `EventRouter` subscriptions are never registered, `MilestoneTracker` never fires, and the `TaskStarted/Completed/Failed/Blocked` and `SubtaskCreated` publishers have no callers", "body": "# What happens\n\nAgainst `v0.17.0`. `EventRouter.startRouting` (`$core/agents/events/EventRouter.kt:24-33`) iterates a map that only `subscribeToEventClassType` (`:56`) fills, and that method has no caller, so no agent reacts to any event. `MilestoneTracker` (internal) listens for task Completed/Failed events that nothing publishes: `AgentEventApi.publishTaskStarted / Progressed / Completed / Failed / Blocked / SubtaskCreated` (`$core/agents/events/api/AgentEventApi.kt:458-599`) have no callers. A `TaskCreated` from `pursue` or `wake` therefore adds a Pending item to `WorkspaceStateStore` that never leaves Pending. `docs/concepts/event-serial-bus.md:73` (\"A publishes; B subscribes\") describes a mechanism with no subscriber.\n\n# Expected\n\nA hosted run (socket-link/ampere#890 as re-scoped) publishes the task lifecycle through the door with the run id; the router either gains a registration path on the public API or is removed with its tracker.\n\n# Verify\n\nAfter a hosted run: `TaskStarted` and `TaskCompleted`/`TaskFailed` on the store with the run id; `WorkspaceStateStore` shows the item leaving Pending.", "llm": "not_gui", "quote": "EventRouter.startRouting iterates a map that only subscribeToEventClassType fills, and that method has no caller, so no agent reacts to any event."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/hatamiarash7/RTL-Toast/issues/5", "title": "\u26a0 Migrate Immediately! ASAP! \u26a0 ", "body": "jCenter is currently deprecated and artifacts can only be downloaded till 2022-02-01, consider migrating to jitpack or maven central. Your library is already breaking.\r\nmore info here:\r\nhttps://developer.android.com/studio/build/jcenter-migration", "llm": "not_gui", "quote": "jCenter is currently deprecated and artifacts can only be downloaded till 2022-02-01, consider migrating to jitpack or maven central."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/Suwayomi/Suwayomi-JUI/issues/61", "title": "[Bug] Build error", "body": "---\r\n\r\n## Device information\r\n- Tachidesk-JUI version: (git commit  0015bccc2110cb51603c0a223668d752d9dd12f5)\r\n- Operating System: ( Fedora 35)\r\n- Server Type: ( Internal (i think) )\r\n- Client JVM version: (Java 17.0.1)\r\n\r\n## Steps to reproduce\r\nJust try to build the project from the lastest github commit\r\n\r\n##Logs\r\n```\r\n> Task :presentation:compileKotlinDesktop FAILED\r\ne: /github/workspace/presentation/src/commonMain/kotlin/ca/gosyer/jui/ui/sources/home/SourceHomeScreenVi ations (1 and 2). This is wrong cause combination 2 should return result = false.\r\n\r\nSwitching off mobile data instead I have:\r\n```kotlin\r\n// 1. Correct SSID and password\r\nwiseFyReturnCode = -1002\r\nresult = true\r\n\r\n// 2. Wrong SSID and password\r\nwiseFyReturnCode = -1002\r\nresult = false\r\n```\r\nthat is completely correct.\r\n\r\nValue of wiseFyReturnCode is -1002 probably because it was already added (52 otherwise).\r\n\r\nI think that I'm missing something or maybe there is a bug when mobile network data is on.\r\n\r\nCan you help?\r\n\r\nThank you.", "llm": "not_gui", "quote": "I'm executing the following code"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/crossbario/autobahn-java/issues/433", "title": "NettyWebSocket leaks it's NioEventLoopGroup resources on connection failure", "body": "If you attempt to connect to a crossbar that isn't listening, or fail to connect for another reason, the NettyWebSocket leaks socket / stream resources associated with the NioEventLoopGroup. If the application is persistently attempting reconnection, and the issue is not resolved, the process will eventually run out of file handles.\r\n\r\nAs each call to NettyWebSocket creates a new NioEventLoopGroup, and doesn't keep a reference to it outside of connect() it never gets closed / shutdown.", "llm": "not_gui", "quote": "NettyWebSocket leaks it's NioEventLoopGroup resources on connection failure"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/ionic-team/capacitor-plugins/issues/2310", "title": "[Bug]: status bar is gone after the camera is dismissed (iOS only)", "body": "### Capacitor Version\n\n\ud83d\udc8a   Capacitor Doctor  \ud83d\udc8a \n\nLatest Dependencies:\n\n  @capacitor/cli: 7.0.1\n  @capacitor/core: 7.0.1\n  @capacitor/android: 7.0.1\n  @capacitor/ios: 7.0.1\n\nInstalled Dependencies:\n\n  @capacitor/cli: 7.0.1\n  @capacitor/android: 7.0.1\n  @capacitor/core: 7.0.1\n  @capaci o OTA updates. We want to trace success and error cases or even just add logging. But we did not find any way to register the observer without causing other side effects.\n\nThis is our code, that does not cause work because Crowdin SDK behaves unexpeced:\n```\nCrowdin.registerDataLoadingObserver(\n   object : LoadingStateListener {\n      override fun onDataChanged() {\n         Log.d(\"onDataChanged\")\n      }\n\n      override fun onFailure(throwable: Throwable) {\n         Log.d(\"onFailure\")\n      }\n   }\n)\nCrowdin.init(application, builder.build())\n```\n\nAdding the callback via `registerDataLoadingObserver` has no effect because `Crowdin.init` has not been called yet. When trying to add it after calling `Crowdin.init` it does not work either because the network calls already happened.\nWe also tried delaying the update by using `withInitSyncDisabled()` but manually calling `Crowdin.forceUpdate` does not do the checks to `updateInterval` which is done when using the default config without using `withInitSyncDisabled` option.\n\n**Expected behavior**\nI can call `registerDataLoadingObserver` even before `Crowdin.init` and the observer is registered. \n", "llm": "not_gui", "quote": "Adding the callback via `registerDataLoadingObserver` has no effect because `Crowdin.init` has not been called yet. When trying to add it after calling `Crowdin.init` it does not work either because the network calls already happened."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/nikhilmuz/WhatsApp-Bulk-Sender/issues/14", "title": "whatsapp is not install", "body": "", "llm": "not_gui", "quote": "whatsapp is not install"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/Mino260806/MessengerPro/issues/44", "title": "App not installed as package conflicts with an existing package", "body": "Android 12\r\nFB, Messenger, insta uninstalled\r\n\r\n- tried to install pie no root apk and I got this error\r\n\r\nAp . No disk access violation happens as a result of using the LD SDK.\n\n**Logs**\n```\nStrictMode policy violation; ~duration=257 ms: android.os.strictmode.DiskReadViolation\n    at android.os.StrictMode$AndroidBlockGuardPolicy.onReadFromDisk(StrictMode.java:1596)\n    at android.app.SharedPreferencesImpl.awaitLoadedLocked(SharedPreferencesImpl.java:275)\n    at android.app.SharedPreferencesImpl.getString(SharedPreferencesImpl.java:301)\n    at com.launchdarkly.sdk.android.SharedPreferencesPersistentDataStore.getValue(SharedPreferencesPersistentDataStore.java:33)\n    at com.launchdarkly.sdk.android.Migration.migrateWhenNeeded(Migration.java:35)\n", "llm": "not_gui", "quote": "Set up StrictMode in your app. Initialize LaunchDarkly SDK via init with timeout set to zero."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/xLexip/Adaptive-Theme/issues/92", "title": "Google Play Store claims my device is not supported", "body": "Hi, \n\nI have a Pixel 10 Pro Fold and wanted to try your app. Play store claims my device is not supported. Any idea how to debug this? ", "llm": "not_gui", "quote": "Play store claims my device is not supported."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/collinsmith/riiablo/issues/73", "title": "Remaining bytes in stream after DS1 codec reads", "body": "Some DS1 files are being loaded with remaining bytes left in the stream. So far I've only noticed two instances, both of which are version 13. I haven't looked into this a great deal because everything seems to work just fine, but I'd like to audit all of the used DS1s to see if this occurs for other version as well. My code checks versions 9-13 specifically, but I only have error reports for version 13, so 9-12 may be unnecessary.\r\n\r\nEasy thing first though. The algorithm needs to be looked over for typos and then I'll look into possible errors in the file format. At least for the errors below, the data looks alright, I'm guessing this is some extra int towards the end of the stream that either isn't skipped properly or indicates the size of the corresponding list is 0 (both remaining values are 0).\r\n\r\n```\r\nDS1: data/global/tiles/Act1/Outdoors/URiver.ds1 4B still available in stream! version=13; [00, 00, 00, 00]\r\nDS1: com.riiablo.map.DS1@6da246e4[fileName=data/global/tiles/Act1/Outdoors/URiver.ds1,version=13,width=8,height=8,act=1,tagType=0,numFiles=2,numWalls=0,numFloors=1,numTags=0,numShadows=1,layerStream=[8, 10],floorLine=9,floorLen=81,shadowLine=9,shadowLen=81,tagLine=0,tagLen=0,wallLine=0,wallLen=0,numObjects=0,numGroups=0,numPaths=0]\r\nDS1: data/global/tiles/Act1/Outdoors/LRiverC.ds1 4B still available in stream! version=13; [00, 00, 00, 00]\r\nDS1: com.riiablo.map.DS1@699ddf88[fileName=data/global/tiles/Act1/Outdoors/LRiverC.ds1,version=13,width=8,height=8,act=1,tagType", "llm": "not_gui", "quote": "Some DS1 files are being loaded with remaining bytes left in the stream. So far I've only noticed two instances, both of which are version 13."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/Blankj/AndroidUtilCode/issues/1802", "title": "\u4e0d\u652f\u6301jdk11 \u5417", "body": "## \u63cf\u8ff0 Bug\r\n\r\n\u76ee\u524d1.31.1\u7248\u672c\uff0c\u628a\u9879\u76ee\u7684jdk\u66f4\u65b0\u523011\u540e\u5c31\u62a5\u4e86BusUtils: The bus of tag \uff1cXXX\uff1e is not exists\u5f02\u5e38\uff0c\u5176\u4ed6\u90fd\u6ca1\u6709\u6539\u52a8\r\n\r\n", "llm": "not_gui", "quote": "\u628a\u9879\u76ee\u7684jdk\u66f4\u65b0\u523011\u540e\u5c31\u62a5\u4e86BusUtils: The bus of tag \uff1cXXX\uff1e is not exists\u5f02\u5e38"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/hossain-khan/android-compose-highlight/issues/486", "title": "Bound WebView bridge initialization and propagate page-load failures", "body": "## Summary\n\nEnsure every caller waiting for the hidden WebView bridge either receives a ready WebView or a typed failure within a\nbounded period.\n\n## Current behavior\n\n`WebViewManager.getReadyWebView()` waits on a `CompletableDeferred` that is completed only by `onPageFinished()`.\n\nThe manager does not complete it from page-load error callbacks, and engine methods call `getReadyWebView()` before\nentering the existing JavaScript timeout. If `bridge.html` never finishes loading, calls can suspend indefinitely.\n\nAffected operations include:\n\n- `highlightToHtml()`\n- `highlight()`\n- `highlightBothThemes()`\n- `highlightAuto()`\n- `supportedLanguages()`\n- `highlightJsVersion()`\n- `getLanguage()`\n\n## Expected behavior\n\n- Bridge initialization has a documented timeout.\n- Main-frame loading failures complete all current waiters.\n- Failure is returned as `HighlightException.WebViewInitFailed` or another intentional subtype.\n- A failed initialization can be retried cleanly.\n- No caller waits indefinitely.\n\n## Implementation considerations\n\n- Track the expected bridge URL and distinguish main-frame errors from subresource errors.\n- Handle `onReceivedError`, relevant HTTP errors, and SSL failures as appropriate for the local HTTPS asset URL.\n- Represent readiness as a success or failure result rather than only `CompletableDeferred<WebView>`.\n- Include initialization and readiness in timeout coverage, not only `evaluateJavascript()`.\n- Ensure concurrent callers observe the same initializatio", "llm": "not_gui", "quote": "The manager does not complete it from page-load error callbacks, and engine methods call `getReadyWebView()` before entering the existing JavaScript timeout. If `bridge.html` never finishes loading, calls can suspend indefinitely."}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/yellowbluesky/PixivforMuzei3/issues/143", "title": "File extensions are not correctly being assigned", "body": "getLocalFileExtension() was temporarily refactored out, and I forgot to re-enable it", "llm": "not_gui", "quote": "getLocalFileExtension() was temporarily refactored out, and I forgot to re-enable it"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/caoccao/Javet/issues/566", "title": "Linux V8-mode libraries are not linked against libm \u2014 `undefined symbol: exp2` on OpenJ9", "body": "## Summary\n\nSince v5.0.0, `libjavet-v8-linux-x86_64.v.*.so` is built without a link to `libm`. It leaves 12 math symbols undefined (`exp2`, `log2`, `pow`, `nan`, `nearbyint`, among others) and relies on the host process to already provide them.\n\nThat assumption holds on HotSpot, whose `libjvm.so` links `libm.so.6` and is loaded into the global symbol scope, so the undefined symbols quietly bind. It does not hold on Eclipse OpenJ9 / IBM Semeru: their `libjvm.so` links only `libdl`, `libpthread` and `libc`, so nothing fills the gap and the process aborts on the first call.\n\nBecause the dynamic linker resolves these lazily, the failure surfaces only when one of those symbols is first called, which in practice is V8 teardown at JVM shutdown:\n\n```\njava: symbol lookup error: /tmp/javet/2552/libjavet-v8-linux-x86_64.v.5.0.3.so: undefined symbol: exp2\n```\n\nThe symbols were missing the whole time \u2014 they were simply never called before that point.\n\n## Affected versions\n\nv5.0.0 through at least v5.0.3, V8 mode, Linux. Node mode is not affected.\n\n| Artifact | `NEEDED` | Unresolved math symbols |\n|---|---|---|\n| `libjavet-v8-linux-x86_64` 4.1.7 | `libm.so.6`, `libc.so.6` | 0 |\n| `libjavet-v8-linux-x86_64` 5.0.0 | `librt.so.1`, `libc.so.6` | 12 |\n| `libjavet-v8-linux-x86_64` 5.0.3 | `librt.so.1`, `libc.so.6` | 12 |\n\n`linux-arm64` was not measured, but it is produced by the same CMake branch and is expected to be affected identically. Worth confirming as part of the fix.\n\n## Environment\n\n- ", "llm": "not_gui", "quote": "The failure surfaces only when one of those symbols is first called, which in practice is V8 teardown at JVM shutdown: `java: symbol lookup error: ... undefined symbol: exp2`"}, {"list": "to_verify_scope_notgui100", "kind": "scope", "url": "https://github.com/getActivity/GsonFactory/issues/39", "title": "[Bug]\uff1a\u89e3\u6790\u51fa\u73b0\u62a5\u9519", "body": "### \u6846\u67b6\u7248\u672c\u3010\u5fc5\u586b\u3011\r\n\r\n9.5\r\n\r\n### \u95ee\u9898\u63cf\u8ff0\u3010\u5fc5\u586b\u3011\r\n\r\n* \u6211\u4f7f\u7528 `com.github.getActivity:EasyHttp:12.8` \u6846\u67b6\uff0c\u4ee3\u7801\u62f7\u8d1d\u7684\u662f EasyHttp \u7684\u6a21\u677f\u4ee3\u7801\uff0c\u4f7f\u7528 `com.github.getActivity:GsonFactory:9.5` \u89e3\u6790\u7684\u65f6\u5019\u4f1a\u62a5\u9519\uff0c\u9519\u8bef\u4fe1\u606f\r\n\r\n```text\r\nNo virtual method getModule()Ljava/lang/Module; in class Ljava/lang/Class; or its super classes (declaration of 'java.lang.Class' appears in /apex/com.android.art/javalib/core-oj.jar)\r\njava.lang.NoSuchMethodError: No virtual method getModule()Ljava/lang/Module; in class Ljava/lang/Class; or its super classes (declaration of 'java.lang.Class' appears in /apex/com.android.art/javalib/core-oj.jar)\r\n\tat kotlin.reflect.jvm.internal.impl.serialization.deserialization.builtins.BuiltInsResourceLoader.loadResource(BuiltInsResourceLoader.java:26)\r\n\tat kotlin.reflect.jvm.internal.impl.descriptors.runtime.components.ReflectKotlinClassFinder.findBuiltInsData(ReflectKotlinClassFinder.kt:52)\r\n\tat kotlin.reflect.jvm.internal.impl.builtins.jvm.JvmBuiltInsPackageFragmentProvider.findPackage(JvmBuiltInsPackageFragmentProvider.kt:60)\r\n\tat kotlin.reflect.jvm.internal.impl.serialization.deserialization.AbstractDeserializedPackageFragmentProvider$fragments$1.invoke(AbstractDeserializedPackageFragmentProvider.kt:35)\r\n\tat kotlin.reflect.jvm.internal.impl.serialization.deserialization.AbstractDeserializedPackageFragmentProvider$fragments$1.invoke(AbstractDeserializedPackageFragmentProvider.kt:34)\r\n\tat kotlin.reflect.jvm.internal.impl.storage.LockBasedStorageManager$MapBasedMemoizedFunction.invoke(LockBase const KEY = "label-check-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const rater = document.getElementById("rater");
rater.value = state.__rater || ""; rater.oninput = () => { state.__rater = rater.value; save(); };
const keyOf = it => it.list + "|" + it.url;
function render() {
  const list = document.getElementById("list"); list.textContent = "";
  const hide = document.getElementById("hideDone").checked;
  let done = 0;
  ITEMS.forEach((it, i) => {
    const v = state[keyOf(it)]; if (v) done++;
    if (hide && v) return;
    const c = document.createElement("div"); c.className = "card" + (v ? " done" : "");
    const h = document.createElement("div"); h.innerHTML = "<b></b> <span class=meta></span>";
    h.querySelector("b").textContent = (i + 1) + ". " + it.title;
    h.querySelector(".meta").textContent = "[" + it.list + "]";
    const a = document.createElement("a"); a.href = it.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = it.url;
    const q = document.createElement("div"); q.className = "meta";
    q.textContent = "LLM: " + it.llm + (it.quote ? '  \u2014 "' + it.quote + '"' : "");
    const pre = document.createElement("pre"); pre.textContent = it.body;
    const row = document.createElement("div");
    const agree = document.createElement("button"); agree.textContent = "Agree (" + it.llm + ")";
    agree.onclick = () => { state[keyOf(it)] = it.llm; save(); render(); };
    const sel = document.createElement("select");
    ["(other label)"].concat(it.kind === "scope" ? SCOPE : TRIGGER).forEach(o => { const op = document.createElement("option"); op.textContent = o; sel.appendChild(op); });
    if (v && v !== it.llm) sel.value = v;
    sel.onchange = () => { if (sel.selectedIndex > 0) { state[keyOf(it)] = sel.value; save(); render(); } };
    const st = document.createElement("span"); st.className = "meta"; st.textContent = v ? "  your verdict: " + v : "";
    row.append(agree, " ", sel, st);
    c.append(h, a, q, pre, row); list.appendChild(c);
  });
  document.getElementById("progress").textContent = done + " / " + ITEMS.length + " done";
}
document.getElementById("hideDone").onchange = render;
document.getElementById("export").onclick = () => {
  const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ["rater,list,url,kind,llm_label,verdict"].concat(ITEMS.map(it =>
    [state.__rater || "", it.list, it.url, it.kind, it.llm, state[keyOf(it)] || ""].map(esc).join(",")));
  const blob = new Blob([lines.join("\n") + "\n"], {type: "text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "labels_" + (state.__rater || "rater") + ".csv"; a.click();
};
render();
