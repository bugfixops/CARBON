<style>
:root { --bg:#fff; --fg:#1d1d1f; --muted:#666; --line:#ddd; --card:#f7f7f8; --accent:#0b57d0; }
@media (prefers-color-scheme: dark) { :root { --bg:#151517; --fg:#ececf0; --muted:#a0a0a8; --line:#33333a; --card:#1f1f23; --accent:#8ab4f8; } }
body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; margin:0; padding:16px; }
header { position:sticky; top:0; background:var(--bg); padding:8px 0 12px; border-bottom:1px solid var(--line); z-index:1; }

.card.done { opacity:.6; } .meta { color:var(--muted); font-size:13px; }
pre { white-space:pre-wrap; max-height:180px; overflow:auto; font-size:13px; background:var(--bg); padding:8px; border-radius:6px; }
button, select, input { font:inherit; padding:4px 8px; } a { color:var(--accent); }

sion: 8.14.3\n- AGP Version: 8.10.1\n\n**Test Device (please complete the following information):**\n- Model: Google Pixel 7a\n- Android OS: 16\n- Type: Real\n\n**Code**\n```\nval cropOptions = CropOptions(\n            cropShape = CropShape.FreeForm,\n            contentScale = ContentScale.Fit,\n            gridLinesVisibility = GridLinesVisibility.ON_TOUCH,\n            gridLinesType = GridLinesType.GRID,\n            handleRadius = 8.dp,\n            touchPadding = 30.dp,\n        )\n\n        val cropController = rememberCropController(\n            bitmap = bitmap,\n            cropOptions = cropOptions,\n        )\n\nImageCropper(\n                modifier = Modifier\n                    .fillMaxSize()\n                    .padding(24.dp),\n                cropController = cropController\n            )\n```\n\n**Additional context**\n\n                 java.lang.IllegalArgum", "llm": "drag_and_drop", "quote": "Simply try to drag the cropper."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/stipop-development/stipop-android-sdk/issues/9", "title": "[Bug] My stickers tab drag and drop sorting issue.", "body": "", "llm": "drag_and_drop", "quote": "My stickers tab drag and drop sorting issue."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/icerockdev/moko-units/issues/60", "title": "Diffable data source can skip moved visible cells update", "body": "Looks like moving rows skip too and don't binding like other visible cells:\r\nhttps://github.com/icerockdev/moko-units/blob/master/units/src/iosMain/swift/Differ/UnitsSource%2BDiffable.swift#L40", "llm": "drag_and_drop", "quote": "moving rows"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/dzikoysk/presence-of-mind/issues/57", "title": "Reordering tasks is a bit glitched on RC.13", "body": "", "llm": "drag_and_drop", "quote": "Reordering tasks"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/ashutoshg her details\r\n\r\nThe [project](https://github.com/z0xyz/knounce/tree/main/app/src/main/kotlin/com/polendina/knounce/presentation/shared/floatingbubble) that I've currently using.\r\n\r\nhttps://github.com/TorryDo/Floating-Bubble-View/assets/48662854/bf363fe1-677b-4039-a126-9c", "llm": "drag_and_drop", "quote": "Drag the popup sideways for example\n2. Drop the popup to be placed"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Dawncraft/Dawn-Desktop-Addons/issues/3", "title": "\u5728Android 10\u4e0a\u66f4\u65b0\u5e94\u7528\u4f1a\u5bfc\u81f4\u5fae\u4ef6\u91cd\u7f6e\u4e3a\u9ed8\u8ba4\u5e03\u5c40", "body": "**\u8be5bug\u65e0\u6cd5\u5728Android 12\u4e0a\u590d\u73b0**\r\n\r\n\u590d\u73b0\u6b65\u9aa4:\r\n1. \u5b89\u88c5\u7248\u672c\u53f7\u4e3aX\u7684\u6b64\u5e94\u7528\r\n2. \u5728\u684c\u9762\u653e\u7f6e\u51e0\u4e2a\u5fae\u4ef6\r\n3. \u5c06\u7248\u672c\u53f7\u6539\u4e3aX+1\r\n4. \u518d\u6b21\u5b89\u88c5, \u53d1\u73b0\u5fae\u4ef6\u88ab\u91cd\u7f6e\u4e3a\u4e86\u9ed8\u8ba4\u5e03\u5c40\r\n\r\n\u6000\u7591\u662f\u684c\u9762\u6ca1\u6709\u901a\u77e5\u5c0f\u90e8\u4ef6\u5237\u65b0\u6216\u8005\u662f\u7531\u4e8e\u67d0\u4e9b\u539f\u56e0\u5237\u65b0\u5931\u8d25\u5bfc\u81f4\u91cd\u7f6e\r\n\u7531\u4e8e\u8be5\u95ee\u9898\u65e0\u6cd5\u89e3\u51b3, \u6240\u4ee5\u6211\u63a5\u6536\u4e86MY_PACKAGE_REPLACED\u5e7f\u64ad\u5e76\u5728\u5e7f\u64ad\u4e2d\u5237\u65b0\u6240\u6709\u5fae\u4ef6, \u4f46\u4ecd\u7136\u65e0\u6548\r\n\r\n~~\u603b\u4e4b\u52aa\u529b\u4e86\u4e00\u5929\u8fd8\u662f\u6ca1\u89e3\u51b3\u554a~~", "llm": "drag_and_drop", "quote": "\u5728\u684c\u9762\u653e\u7f6e\u51e0\u4e2a\u5fae\u4ef6"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/EmmanuelMess/Simple-Accounting/issues/42", "title": "Crash", "body": "```\r\n12-24 20:54:05.631 18192-18192/com.emmanuelmess.simpleaccounting E/AndroidRuntime: FATAL EXCEPTION: main\r\n                                                                                   Process: com.emmanuelmess.simpleaccounting, PID: 18192\r\n                                                                                   java.lang.IndexOutOfBoundsException\r\n                                                                                       at java.util.Collections.swap(Collections.java:1937)\r\n                                                                                       at com.emmanuelmess.simpleaccounting.activities.dialogs.CurrencyPicker.swap(CurrencyPicker.java:431)\r\n                                                                                       at com.emmanuelmess.simpleaccounting.activities.dialogs.CurrencyPicker.access$1000(CurrencyPicker.java:42)\r\n                                                                                       at com.emmanuelmess.simpleaccounting.activities.dialogs.CurrencyPicker$4.move(CurrencyPicker.java:354)\r\n                                                                                       at com.emmanuelmess.simpleaccounting.activities.dialogs.CurrencyPicker$4.onTouch(CurrencyPicker.java:326)\r\n                                                                                       at android.view.View.dispatchTouchEvent(View.java:9293)\r\n```", "llm": "drag_and_drop", "quote": "at com.emmanuelmess.simpleaccounting.activities.dialogs.CurrencyPicker$4.move(CurrencyPicker.java:354)"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/SoltauFintel/blockpuzzle/issues/23", "title": "Fatal Android 13 problem. Help wanted!", "body": "I cannot play the game on my Samsung A51 device. Dragging an game piece the icon becomes a blur effect and the size is wrong. The size is between the playing field size (=correct) and the game piece view size (=half size).\r\n\r\nDeinstallation and re-installation does not solve this problem. Restarting the device solves the problem for maybe one or more moves.\r\n\r\nAPI level 33", "llm": "drag_and_drop", "quote": "Dragging an game piece the icon becomes a blur effect and the size is wrong."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/SoltauFintel/blockpuzzle/issues/17", "title": "I'm pretty sure that's a bug (but not so sure how to reproduce it)", "body": "My screen was almost full with top line being empty and some empty space on the left. I had 3x3 in the stash, 3x3 and, if I remember correctly, 2x1. I removed two horizontal lines with 2x1 but the game somehow decided that I've lost. But not really lost I guess because while the field is gray I can still place pieces.\r\n![Screenshot_2021-01-27-04-02-20-932_de mwvb blockpuzzle](https://user-images.githubusercontent.com/57290908/105906268-0dce2600-6056-11eb-9279-9398dd3c8885.jpg)\r\n![Screenshot_2021-01-27-04-10-22-102_de mwvb blockpuzzle](https://user-images.githubusercontent.com/57290908/105906288-1292da00-6056-11eb-942d-021612473172.jpg)\r\n![Screenshot_2021-01-27-04-10-33-597_de mwvb blockpuzzle](https://user-images.githubusercontent.com/57290908/105906303-16266100-6056-11eb-8f18-afbc3fce5033.jpg)\r\n\r\n\r\n", "llm": "drag_and_drop", "quote": "I removed two horizontal lines with 2x1 but the game somehow decided that I've lost. But not really lost I guess because while the field is gray I can still place pieces."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Irineu333/NeoRegex/issues/77", "title": "Arrastar janela parando de funcionar", "body": "**Describe the bug**\nFuncionalidade de arrastar a janela simplesmente para de funcionar ap\u00f3s intera\u00e7\u00e3o com menu ou seletor de telas.\n\n**To Reproduce**\nSteps to reproduce the behavior:\n1. Interaja com o menu\n2. Tente arrastar a janela\n3. N\u00e3o vai funcionar\n\n**Expected behavior**\nn/d\n\n**Screenshots**\nn/d\n\n**OS**\n- [x] Windows\n- [ ] Linux\n- [ ] macOS\n- [ ] Android\n- [ ] Web\n\n**OS Version**: 10/11\n\n**Stack trace**\nn/d\n\n**Additional context**\nn/d\n", "llm": "drag_and_drop", "quote": "Tente arrastar a janela"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/jrpie/launcher/issues/251", "title": "[bug] can't add widgets", "body": "### Describe the Bug\n\nWidgets can't be added the home screen. Proton calendar works and ulauncher clock but nothing else I would use.\n\n### Expected Behavior\n\n_No response_\n\n### To Reproduce\n\n_No response_\n\n### Your Device\n\n\u00b5Launcher version: 0.2.8 (53)\nCommit a90820a\nAndroid version: 14 (sdk 34)\nModel: Nokia X20\nDevice: QKS_sprout\nBrand: Nokia\nManufacturer: HMD Global", "llm": "drag_and_drop", "quote": "Widgets can't be added the home screen."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/mvmike/min-cal-widget/issues/201", "title": "Height problem", "body": "### Checklist\n\n- [X] I am able to reproduce the bug with the [latest version](https://github.com/mvmike/min-cal-widget/releases/latest).\n- [X] I made sure that there are *no existing issues* - [open](https://github.com/mvmike/min-cal-widget/issues) or [closed](https://github.com/mvmike/min-cal-widget/issues?q=is%3Aissue+is%3Aclosed) - which I could contribute my information to.\n- [X] I have taken the time to fill in all the required details. I understand that the bug report could be dismissed otherwise.\n- [X] This issue contains only one bug.\n\n### Describe the bug\n\nOnly at 5*2, the height of the widget is 2. Otherwise, no matter 4*2, 3*2, 2*2, the height is only about 1.5.\n\n### Steps To Reproduce\n\nresize the widget to 5*2 then reboot or change system language, the height will be full height. otherwise , the height is 1.5.\n\n### Expected Behavior\n\nI think the height should be full height without being cut off. But I found that many apps have same problem, including the month view of Google Calendar widget, but the schedule view of Google Calendar widget displays full height regardless of the width.\n\n### Affected app version\n\n2.13.0\n\n### Device\n\nrealme narzo 50 pro\n\n### Android version\n\n14\n\n### Launcher\n\nrealme ui 13.0.15\n\n### Additional context and screenshots\n\n![Screenshot_2023-11-08-16-14-08-98_b783bf344239542886fee7b48fa4b892](https://github.com/mvmike/min-cal-widget/assets/42535840/4b9896e1-b96d-4811-a5cd-35a62a5b7db8)\r\n", "llm": "drag_and_drop", "quote": "resize the widget to 5*2"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/0x4f53/Wristkey/issues/42", "title": "[FEATURE] v3.2 todo", "body": "### Bug fixes\n- [ ] Fix splash screen incompatibility bug for Play Store (use official Splash Screen API)\n- [ ] Fix a bug where RecyclerView Items flicker and give wrong 2FA codes (possible fix: listview)\n- [ ] Disallow file imports by detecting if app is release or debug version\n- [ ] Freeze app on exit to prevent reloading\n\n### Performance improvements\n- [ ] Allow option to disable separate data encryption (force user to enable keyguard and disable USB and WiFi debugging first!)\n- [ ] Populate app views dynamically instead of at once (shimmer)\n\n### New features\n- [ ] Make a new compact mode with Apple Watch style bubbled chips and popup cards.\n- [ ] Add color based tagging\n- [ ] Add a simple encrypted export option.\n- [ ] Add Bitwarden API support, with API key transfers via QR scanning\n- [ ] Allow more sorting options\n  - [ ] custom (draggable state vault)\n  - [ ] most used (detect code tap frequency)\n  - [ ] recently used\n  - [ ] alphabetical (ascending and descending)", "llm": "drag_and_drop", "quote": "custom (draggable state vault)"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/jordond/drag-select-compose/issues/113", "title": "dragSelectState is selecting incorrect items if data source isn't static list", "body": "Hello \ud83d\udc4b\ud83c\udffd, DragSelectState behaves very weird when item list isn't static.\r\n\r\nFor an example, I'm fetching data from on-device database(Room) using the following:\r\n```\r\nval deletedPhotos by localPhotoViewModel.repository.allCameraTrashedPhotos.collectAsState(emptyList())\r\nval dragSelectState = rememberDragSelectState<PhotoEntity>(compareSelector = { it.uid!! })\r\n```\r\n\r\nNow drag-select works fine when data loads for the first time. But when some more rows are added/deleted from database, then sometimes drag-select selects incorrect item, or sometimes can't select/de-select items.\r\n\r\nI'm not sure whether I'm doing something wrong, or whether there is an issue in library. Here is how I'm rendering images:\r\n```\r\n            items(photos.size) { index ->\r\n                val isSelected by remember {\r\n                    derivedStateOf { dragSelectState.isSelected(photos[index]) }\r\n                }\r\n\r\n                PhotoItemContent(\r\n                    item = photos[index],\r\n                    inSelectionMode = dragSelectState.inSelectionMode,\r\n                    isSelected = isSelected,\r\n                    modifier = Modifier\r\n                        // Add semantics for accessibility\r\n                        .semantics {\r\n                            if (!dragSelectState.inSelectionMode) {\r\n                                onLongClick(\"Select\") {\r\n                                    dragSelectState.addSelected(photos[index])\r\n                                    true\r\n        ", "llm": "drag_and_drop", "quote": "drag-select selects incorrect item, or sometimes can't select/de-select items"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/jordond/drag-select-compose/issues/44", "title": "Bug: First selected item is wrong", "body": "Using Compose for Desktop v1.4.3 I observed a wrong behavior on selection of the first item that activates the selection mode.\r\n\r\nPlease see this short demonstration video:\r\nhttps://github.com/jordond/drag-select-compose/assets/9299303/2fd05370-604d-48d1-a032-9284641ac975\r\n\r\nThis is the part where I included the library in my code:\r\n```\r\n    BoxWithConstraints {\r\n\r\n on dependencies here; they belong\r\n        // in the individual module build.gradle files\r\n        classpath 'com.google.gms:google-services:3.0.0'\r\n    }\r\n}\r\n\r\nallprojects {\r\n    repositories {\r\n        jcenter()\r\n    }\r\n}\r\n\r\ntask clean(type: Delete) {\r\n    delete rootProject.buildDir\r\n}\r\n\r\n```\r\nWorkaround:\r\nFor now I just rollback to 2.3.3 And everything went to normal.\r\n", "llm": "drag_and_drop", "quote": "the dragging processes of the card stack is slow down"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/VinylMusicPlayer/VinylMusicPlayer/issues/1272", "title": "Crash Report", "body": "I am not sure what caused this crash. I do not recall opening the app since i downloaded it a few hours ago. However, I tried to create a widget of the \"classic style\" \n\nApp version: 1.11.0\nApp version code: 202\nAndroid build version: A576BXXS4AZG5\nAndroid release version: 16\nAndroid SDK version: 36\nAndroid build ID: BP4A.251205.006.A576BXXS4AZG5\nDevice brand: samsung\nDevice manufacturer: samsung\nDevice name: a57x\nDevice model: SM-A576B\nDevice product name: a57xnatur\nDevice hardware name: s5e8865\nABIs: [arm64-v8a]\nABIs (32bit): []\nABIs (64bit): [arm64-v8a]\n\n## Time: \n2026/08/05 14:29:28\n## Extra info: \nOriginal file: /storage/emulated/0/Music/Samsung/Over_the_Horizon.m4a\n## Stack: \njava.lang.NullPointerException: Attempt to invoke virtual method 'int java.lang.Integer.intValue()' on a null object reference\n\tat org.jaudiotagger.audio.generic.GenericAudioHeader.getChannelNumber(Unknown Source:2)\n\tat org.jaudiotagger.audio.mp4.Mp4InfoReader.read(Unknown Source:613)\n\tat org.jaudiotagger.audio.mp4.Mp4FileReader.getEncodingInfo(Unknown Source:2)\n\tat org.jaudiotagger.audio.generic.AudioFileReader2.read(Unknown Source:96)\n\tat org.jaudiotagger.audio.AudioFileIO.readFile(Unknown Source:14)\n\tat org.jaudiotagger.audio.AudioFileIO.read(Unknown Source:4)\n\tat com.poupa.vinylmusicplayer.util ModifierCursorController.onTouchEvent(Editor.java:5450)\r\n       at android.widget.Editor.onTouchEvent(Editor.java:1370)\r\n       at android.widget.TextView.onTouchEvent(TextView.java:9657)\r\n       at android.view.View.dispatchTouchEvent(View.java:11776)\r\n       at android.view.ViewGroup.dispatchTransformedTouchEvent(ViewGroup.java:2968)\r\n       at android.view.ViewGroup.dispatchTouchEvent(ViewGroup.java:2657)\r\n       at android.view.ViewGroup.dispatchTransformedTouchEvent(ViewGroup.java:2968)\r\n       at android.view.ViewGroup.dispatchTouchEvent(ViewGroup.java:2657)\r\n       at android.view.ViewGroup.dispatchTransformedTouchEvent(ViewGroup.java:2968)\r\n       at android.view.ViewGroup.dispatchTouchEvent(ViewGroup.java:2657)\r", "llm": "drag_and_drop", "quote": "trying to select some text causes an `IndexOutOfBoundsException`"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Elnix90/Dragon-Launcher/issues/422", "title": "[BUG] Debounce time between entering different nests is longer than in earlier releases", "body": "### Requirements\n\n- [x] I checked for duplicate issues in both opened and closed\n- [x] I updated the app to the latest version\n- [ ] I updated the app to the latest beta version to test (check both if you did so)\n- [ ] I haven't read those requirements\n\n### Description\n\nOlder versions felt \"snappier\" in response to changing nests\n\n### Steps to Reproduce\n\nhave a nest with a nest within it\nswipe into new nest\n**quickly** swipe around to choose new app\n\n### Expected Behavior\n\n1. swipe to different nest\n2. lift finger to select different nest\n3. swipe again near instantly\n4. have ability to select app that was in the different nest\n\n### Actual Behavior\n\n1. swipe to different nest\n2. lift finger to select different nest\n3. swipe again near instantly\n4. nothing happens because I was too quick\n5. required to lift finger and then swipe to select apps in the nest\n\n### Version\n\nv4.2.0\n\n### Device and version\n\nGoogle Pixel 8a\nAndroid 17\nGrapheneOS\n\n### Logs\n\n```shell\n\n```\n\n### Additional Context\n\ncould be Mandela effect where I'm crazy, but I am fairly certain I'm not\na feature of a debounce time in relation to entering different nests could be feasible to fix to the issue whilst creating a customization option", "llm": "quick_tap", "quote": "quickly swipe around to choose new app"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Anrimian/music-player/issues/81", "title": "Play queue: bug with removed item restoration", "body": "1) Exists single item in play queue\r\n2) Remove it\r\n3) Prepare new queue before snackbar will disappear\r\n4) Restore item -> error\r\n\r\nCancel snackbar on new queue receiving?\r\n\r\n+ case: \r\n 1) Long queue\r\n 2) Remove item\r\n 3) Create new queue from library\r\n 4) Restore item -> error(id clash) \r\n \r\n + case but on step 2 reshuffle queue - false-positive remove?", "llm": "quick_tap", "quote": "Prepare new queue before snackbar will disappear"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/cvzi/ScreenshotTile/issues/395", "title": "[Feature] Hide toast message before new screenshot", "body": "After a first screenshot, if you want take another one frapidly after that, there is a high chance you'll end up with the pop-uo for the previous one taking some space on the second screenshot.\r\n\r\nScreenshotTile should automatically hide its own pop-ups before taking a new screenshot to prevent this.", "llm": "quick_tap", "quote": "if you want take another one frapidly after that"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/qpst4/XGesture/issues/11", "title": "Crash trying to open the screenshot editor", "body": "### App Version / \u5e94\u7528\u7248\u672c\n\n1.23.0\n\n### Device & Android Version / \u8bbe\u5907\u578b\u53f7\u4e0e\u5b89\u5353\u7248\u672c\n\nAndroid 16/HyperOS 3\n\n### Privilege Mode / \u4f7f\u7528\u7684\u63d0\u6743\u6a21\u5f0f\n\n- [x] Accessibility Service (\u57fa\u7840\u65e0\u969c\u788d\u670d\u52a1)\n- [x] Shizuku (\u5df2\u6fc0\u6d3b)\n- [ ] Root (KernelSU / Magisk / APatch)\n- [ ] LSPosed Module (Xposed \u6a21\u5757\u5df2\u6fc0\u6d3b)\n\n### Bug Description / \u95ee\u9898\u63cf\u8ff0\n\nWhenever I try to edit a screenshot from the \"full-screen screenshot pick\" it doesn't do anything, upon tapping it multiple times it closes the app and I have to reauthorize accessibility settings.\n\n### Steps to Reproduce / \u590d\u73b0\u6b65\u9aa4\n\nOpen full-screen screenshot pick\nSwitch to screenshot tab\nTry to go into editor\n\n### Logs or Screenshots / \u65e5\u5fd7\u6216\u622a\u56fe\n\n_No response_", "llm": "quick_tap", "quote": "upon tapping it multiple times it closes the app"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/bikram-agarwal/Remember/issues/81", "title": "[BUG] Keystrokes and backspace inputs frequently dropped during text entry", "body": "### Describe the bug\n\nHi sir\nI hope you are wella dn doing awesome \nthanks for the amazing app. It is the awesome app that I want and looking for. \n\nBut there is a bug and issue which I encountered, and I don't find any other same issue in the closed section.\n\nHere is the description of the issue :-\n\n\nI experienced a functional issue in the app where it fails to properly register both typing and erasing actions. When typing, the app frequently drops keystrokes, resulting in missing letters and incomplete words despite the keyboard visually registering the taps. Similarly, when attempting to erase text, the backspace function is severely delayed or unresponsive. I have to press the backspace key multiple times just to delete a single character, making both writing and editing incredibly tedious. This is an issue with how the app processes the input, not a keyboard app problem.\n\n### Steps to reproduce\n\n\n1. Open the app and navigate to a text input field within a note.  \n\n2. Type a continuous string of text or the alphabet at a normal to rapid pace.  \n\n3. Observe that several keystrokes are dropped, resulting in missing characters in the text field even though the keyboard registered the taps.  \n\n4. Tap the backspace key rapidly to erase the typed text.  \n\n5. Observe that the app ignores many of the backspace inputs, requiring multiple taps to delete individual letters due to severe processing lag. \n\n### Expected behavior\n\n\u2022 Every character typed on the keyboard should immediate", "llm": "quick_tap", "quote": "Type a continuous string of text or the alphabet at a normal to rapid pace. ... Tap the backspace key rapidly to erase the typed text."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/bikram-agarwal/Remember/issues/77", "title": "[BUG] text disappearing after typing words while autocorrect is enabled on keyboard", "body": "### Describe the bug\n\nIf I have the auto-correction feature switched on for my keyboards and I type too fast in the body of a new note, the typed word will disappear as I type, and will do one of 3 things: leave no letters as if I input nothing at all, leave the last letter typed, or the last couple of letters. Typing slower seems to work, but this would amount to the speed of typing with only one finger. When auto-correct is turned off, this is not a problem. This also does not happen in any other app.\n\nThis does not happen in the title field of the note, nor does it happen in any field while creating a checklist, only in the body of a note. I tested this on both Heliboard and the AOSP keyboard. \n\n### Steps to reproduce\n\n1. Choose either Heliboard or AOSP keyboard with autocorrect turned on.\n2. Open Remember app\n3. Create new note\n4. Start typing any word in the body of the note\n5. Complete word does not appear, but is either blank, or one the last few letters of the word will be entered.\n\n### Expected behavior\n\nThe letters typed or auto-corrected words should all be entered into the note.\n\n### Device information\n\n- Device: OnePlus 13R\n- OS: LineageOS 23.2 (Android 16)\n- Display size & font size: \n- 6.78 in (172.21 mm)\n1264x2780 (450 PPI)\nFont size: 2/7 (font size number not given, just a slider with 7 notches)\n- Remember version: 1.8.0\n\n\n### Remember logs\n\n[remember-diagnostics.txt](https://github.com/user-attachments/files/32545562/remember-diagnostics.txt)\n\n### Checklist\n", "llm": "quick_tap", "quote": "If I have the auto-correction feature switched on for my keyboards and I type too fast in the body of a new note, the typed word will disappear as I type"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/armanmaurya/InternetRadio/issues/206", "title": "[BUG] It is possible to press a button that is no longer visible and should be inactive", "body": "1. Create a Schedule\n2. Edit it\n3. As quickly as you can, press the \u201cSave\u201d button and then the spot right next to it where the trash can icon was just a moment ago. This simulates a situation where a user\u2019s finger lands between these two buttons, resulting in two presses being registered (this has happened to me a few times, though at first I thought the Schedules were disappearing due to some other error).\n4. Instead of being saved, the Schedule is deleted and disappears from the list which the user is unlikely to notice in a longer list\n\nEven if the trash can button is no longer displayed on the screen when the user taps it a second time, the user\u2019s tap is registered and results in the Schedule being deleted. Since deleting the Schedule does not display a confirmation prompt to the user, the user gets the impression that the Schedule simply disappears and does not know why. Or, even worse, isn't aware that it has disappeared.\n\nFirst, ensure that after the \u201cSave\u201d button is pressed, tapping the screen where the trash can icon was located just a moment ago is not registered as a tap at all.\nSecond, deleting the Schedule should be preceded by a confirmation prompt to avoid further issues resulting from an accidental tap.", "llm": "quick_tap", "quote": "As quickly as you can, press the \u201cSave\u201d button and then the spot right next to it where the trash can icon was just a moment ago."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/darkokoa/compose-datetime-wheel-picker/issues/112", "title": "Bug: wheel needs too much time to settle for updated value", "body": "First of all, thanks for this library!\n\nI found something annoying: the wheel seems to need time to settle for the new value to be updated.\nIn situations where the wheel is placed in a dialog and the user quickly selects a value and confirms, the new value will not be registered.\n\nObserve the updated chip here which takes the value from the wheel:\nhttps://github.com/user-attachments/assets/5766f503-c602-4f83-b07e-161dccc66b35\n\n ", "llm": "quick_tap", "quote": "quickly selects a value and confirms"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/stoatchat/for-android/issues/17", "title": "bug: Message sends to wrong user if another chat is openned before the message fully sends", "body": "### What happened?\n\nIf you're fast enough on swapping to different chat it will send it to that user than the one you intended.  Particularly prominent with image messages where sending can take a little bit longer than text ones.  Probably has a similar problem with videos.\n\nSteps:\n1. Send an image message to User A\n2. Before the message finishes sending to User A open the chat of User B\n3. User B will receive the message intended for User A.\n\nDoesn't seem to be a problem on desktop.\n\nDevice: Samsung Galaxy S20 FE (SM-G781W)\nAndroid Version: 13\nApp ID: chat.revolt\nVersion: 1.3.5\nType: GPAA\nAPI Host: api.revolt.chat\nAPI Version: 0.8.7\nSDK: 33", "llm": "quick_tap", "quote": "Before the message finishes sending to User A open the chat of User B"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Thor-Wayfinder/thor-wayfinder/issues/81", "title": "Home Button Combos Closes Apps", "body": "When using any combo that involves the home button, itll just close the app thats open. Itd be better if it was possible to disable one click home entirely and then make a combo where double or triple tapping the home button executes closing the app. Alternatively, keep the thors home button protection and map the home button combos to the first press like how keymapper does.", "llm": "quick_tap", "quote": "double or triple tapping the home button"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/X1nto/Mauth/issues/87", "title": "bug: double navigation and navigation crashes", "body": "## issue\nspam clicking a button that navigates to a different screen can cause the navigation to occur multiple times\n\nif the navigation in question is navigator::pop, it will crash the app if you navigate backwards at the root of the navigation\n\nhttps://github.com/user-attachments/assets/ab3b348a-fb25-4ba9-9c50-340f3e71c275\n\nin this video i'm spam clicking the settings button, observe how I have to click back many times because settings has been pushed many times\n\nthen i spam click the back button, which results in a crash\n\n## solution\nwrap all navigations in `dropUnlessResumed` (this is [recommended by google](https://issuetracker.google.com/issues/403211353) and it is what i am doing to resolve it in [Navic](https://github.com/ssalggnikool/Navic))\n\nit is very tedious to wrap everything in `dropUnlessResumed` and i don't want to make a massive change like that in every single file so i will leave this up to discussion for a better solution if needed", "llm": "quick_tap", "quote": "spam clicking a button that navigates to a different screen can cause the navigation to occur multiple times"}, {"list": "to_verify_sample", "kind": "trigge havior/issues/30", "title": "When user touches screen during fling the state transitions to end state than scrolls back a little", "body": "Google Maps behavior is such that a touch after a fling (while fling is in progress) is ignored. Current lib behavior is such that when user touches screen during fling, the state transitions to the end state, then scrolls back a little towards the touch. \r\n\r\nI will try looking into this issue, but help is appreciated as well.\r\n", "llm": "quick_tap", "quote": "when user touches screen during fling"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/hoppjan/mensa-sh-android/issues/103", "title": "Cannot refresh from error state in activity", "body": "If I get an error, e.g. \"no meals today\", I cannot swipe to refresh anywhere but on the icon and text.\n\nThis should be enabled for the space around icon and text as well!", "llm": "swipe_region", "quote": "I cannot swipe to refresh anywhere but on the icon and text."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/mueller-ma/TabletopTools/issues/284", "title": "Drawer animation lacks smoothness", "body": "**Describe the bug**\r\nWhile other places in the application have no issue, it seems like the drawer animation really lacks smoothness and appears laggy/with low fps. This can probably be improved.\r\n\r\n**To Reproduce**\r\nSteps to reproduce the behavior:\r\n1. Draw and undraw the drawer.\r\n\r\n**Expected behavior**\r\nThe animation be smoother\r\n\r\n**Device (please complete the following information):**\r\n - Device: Xperia XZ\r\n - Android version: Android Oreo (8.0)", "llm": "swipe_region", "quote": "Draw and undraw the drawer."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Elnix90/Dragon-Launcher/issues/428", "title": "[BUG] Main gesture cannot be activated in areas occupied by items in other nests", "body": "The main gesture's activation area appears to be shared between nests. Is activated by swiping from an area of the screen in any direction. However, if an interactive element (widget or app icon) is placed in a particular area of one nest, starting the gesture from that same area in another nest does not activate the gesture, even when that area is empty in the current nest\n\nSteps to reproduce\n\n1. Create three nests: A, B, and C\n2. In nest A, place a widget at a specific position on the screen\n3. In nest B, place an app icon at a different position\n4. Leave nest C empty\n5. Open nest C\n6. Try to activate the main gesture starting from the screen position occupied by the widget in nest A\n7. Try again from the screen position occupied by the app icon in nest B\n\nActual behavior\n\n- In nest C, the main gesture does not activate when the swipe starts from areas corresponding to interactive elements placed in other nests, even though nest C contains no elements in those locations\n- Swiping from areas not occupied by elements in other nests works normally\n- Removing the interactive element from the other nest makes the gesture work again in that area of nest C\n\nExpected behavior\n\n- Each nest should have its own gesture activation area\n- An element placed in one nest should not prevent the main gesture from being activated from the same screen area in another nest\n\nAdditional information\n\n- The behavior does not appear to depend on nesting hierarchy. It also occurs between nests that a", "llm": "swipe_region", "quote": "Is activated by swiping from an area of the screen in any direction. However, if an interactive element... starting the gesture from that same area in another nest does not activate the gesture"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Anrimian/music-player/issues/123", "title": "System ui gets overloaded somehow", "body": "## Steps to reproduce:\r\n(this happened to me only twice for now)\r\n\r\n1) open an audio file with the app\r\n![Screenshot_20220405-233451_Android System](https://user-images.githubusercontent.com/87947799/161853792-51cb9cfe-ec5a-446d-8919-e58d2a230322.png)\r\n\r\n2) keep the song playing until it's done\r\n\r\n3) open notification panel and look as the fps decreases to 0\r\n![Screenshot_20220405-234012_Music Player](https://user-images.githubusercontent.com/87947799/161854329-c908c746-e1db-4584-a4d3-6974016bf8ea.png)\r\nYes, i am opening the notification panel in the image.\r\n\r\n4) freeze\r\n![Screenshot_20220405-232230_Discord](https://user-images.githubusercontent.com/87947799/161854476-4d550bd3-500b-49e9-9221-754450bcb30a.png)\r\n\r\n5) **_cry_**\r\n\r\n## how to stop when it happends\r\nNever force close system ui (probably a bad idea) and try to play another file to overwrite the currently playing song (play another song)\r\n\r\n## possible fix?!?!???\r\nSync songs that you are playing when you open a file with the app with the play queue\r\n\r\n## more info\r\nApp version: 0.9.3.1 (Build 128)\r\nAndroid version: 11\r\nOne ui version: 3.1", "llm": "swipe_region", "quote": "open notification panel"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/forzzzzz/Calculator-You/issues/10", "title": "Bugs and improvements in version 3", "body": "1. Moving the precision slider messes up the selected separator and decimal separator in the settings. Try choosing different separators and then moving the slider to see what I mean. \r\n2. Keys vibration and sound don't work. At least in my Android 13 Nokia X20. Changing the respective settings does nothing. \r\n3. The history option in the dots menu doesn't make sense, since there's a tab for that. It should be removed. The clear history option though, when in the history tab, is useful. Should be kept.\r\n4. Please, add a quick settings tile, for launching the calculator. It's very convenient.\r\n5. The phrase \"System default\" in the theme setting should be replaced with just \"System\", so that it fits a 2400x1080 screen. Now it doesn't, as you can see in the screenshot below: \r\n\r\n![Screenshot_20240808-181727](https://github.com/user-attachments/assets/2ce8fa7a-3727-4368-aad3-43a72a23708c)\r\n\r\nThat's all for now! Great job! \ud83d\udc4f\ud83d\udc4d", "llm": "swipe_region", "quote": "Moving the precision slider messes up the selected separator and decimal separator in the settings. Try choosing different separators and then moving the slider to see what I mean."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/teccheck/FastLyrics/issues/23", "title": "[Bug] \u201cSynced lyrics\u201d switch randomly switches back to Genius sometimes", "body": "Sometimes there are instances when I selected the synced lyrics and the switch just moves back to Genius, either immediately or sometime later. I have noticed that this sometimes happened when the song starts with instrumentals (i.e., no entry in the LRC at 0:00.0). \r\nAlso this happens when I jump around in the song using the rich notification from my music app. More research will have to be done to catch all instances of this behavior.", "llm": "swipe_region", "quote": "Also this happens when I jump around in the song using the rich notification from my music app."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/MohamedRejeb/Compose-Interactive-Gamepad/issues/1", "title": "X axis direction bug", "body": "great work\r\nthough there is a bug if the device language is configured to an RTL language and not LTR language:\r\nin that case, when you drag the joystick on the X axis, the circle is being dragged to the opposite side. so if you drag left, the circle moves right for example.", "llm": "swipe_region", "quote": "when you drag the joystick on the X axis"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/timusus/Shuttle2/issues/907", "title": "Plex (Android): seeking back after ExoPlayer prepared the next transcoded song likely 404s", "body": "Found reworking #888 (probe findings in support/scripts/plex-transcode-probe.sh header): Plex runs one transcode per user \u2014 any other start (another track, session or client id) replaces the running transcode; the replaced HLS session's segments return 404, a replaced progressive stream ends once its ~6 s buffer is read.\n\nOn Android, once ExoPlayer has prepared the next song's HLS transcode, the current song's transcode is gone, so seeking back in the current song (or any segment fetch past the buffer) likely 404s. Predates #888. iOS only pre-opens the next song near the end of the current one, so it's less exposed (and #888 re-resolves a pre-opened next after a seek re-open).\n\nPossible directions: defer preparing the next transcoded item until near the end; or re-open the current transcode at the playback position on a 404. Needs a device check against the Plex test server.", "llm": "swipe_region", "quote": "seeking back in the current song"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/damontecres/StashAppAndroidTV/issues/763", "title": "[BUG] - Seek bar jumps ~1 minute", "body": "### Description\n\nWhen playing a video, dragging the seek bar forward or backward causes the playback position to jump in approximately 1-minute increments per movement.\n\nThe app is configured for 15-second increments, and this works correctly when using the left/right controls or the forward/back player buttons. However, when using the seek bar directly, it skips in 1-minute intervals.\n\nThis behavior prevents precise seeking using the video preview thumbnails (unless there\u2019s an alternative method I\u2019m not aware of).\n\nI\u2019m not sure whether this is a bug or a limitation of the Android player. I\u2019d appreciate your thoughts.\n\n### Reproduction steps\n\n_No response_\n\n### App Version\n\n0.8.0\n\n### Server Version\n\nv0.30.1\n\n### Device\n\nXaiomi TV Box S 2 (Android 11)\n\n### Logs\n\n```bash\n\n```", "llm": "swipe_region", "quote": "dragging the efault threshold** (logged inside the \"onLoadMore\" method of my EndlessScrollListener):\r\n\r\n- offset = 0 itemcount = 1\r\n- offset = 200 itemcount = 208 (this is the situazione when I've add 8 headers)\r\n- offset = 400 itemcount = 408\r\n- offset = 600 itemcount = 608\r\n- offset = 800 itemcount = 808\r\n- offset = 1000 itemcount = 1008\r\n\r\nThe offset it's **always correct, a multiple of my page size**.\r\n\r\nThis is what I get when i use a threshold of 10 or 50 (I'll put more result just to show that the loading become incorrect and random)\r\n\r\nFirst try:\r\n\r\n- offset = 0 itemcount = 1\r\n- offset = 200 itemcount = 208\r\n- offset = 200 itemcount = 208\r\n- offset = 200 itemcount = 208\r\n- offset = 200 itemcount = 208\r\n- offset = 200 itemcount = 208\r\n- offset = 400 itemcount = 408\r\n- offset = 1400 itemcount = 1408\r\n\r\nSecond try:\r\n\r\n- offset = 200 itemcount =", "llm": "scroll", "quote": "I think the endless scroll feature doesn't work when a threshold greater than 1 is set."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/davideas/FlexibleAdapter/issues/605", "title": "FastScroller handle sync delay", "body": "@davideas Now the Item position is at the top, when the Item scrolls down a distance, the position of the scroll bar does not change\r\n![image](https://user-images.githubusercontent.com/10644057/39645147-ec413536-5009-11e8-917f-c2380e9555ae.png)\r\n![image](https://user-images.githubusercontent.com/10644057/39645118-d75b8b6c-5009-11e8-904a-31022e25c9b3.png)\r\n\r\nScroll bar changes when Item scrolls a long distance, But I can be sure that the above problem is not because of too many items, Because when I continue to scroll down, the scroll bar changes slightly, I feel the synchronization delay of scroll bars may be related to `app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"`, although `appbar_scrolling_view_behavior` is set, but the FastScroller not remove the excess height for scroll bar, causing the first scroll sync delay.\r\n![image](https://user-images.githubusercontent.com/10644057/39645494-2264a93a-500b-11e8-8ad3-52818833d429.png)\r\n\r\n", "llm": "scroll", "quote": "when the Item scrolls down a distance, the position of the scroll bar does not change"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/rubensousa/GravitySnapHelper/issues/49", "title": "SnapListener broken if enough padding is added to end of items to snap to last item", "body": "Use Case: I want a Gravity.Start list where I can have the last item snapped to the first position (all the way at the start).  The reason for this is that I want to highlight / show something related to the item currently snapped and I want to be able to do this for all items.   \r\n\r\nTo accomplish this, you can add enough padding to the end of the recyclerview that you can scroll the last item all the way to the start of the view.  The RecyclerViewSnap functions perfectly - it correctly can snap to all the items including the Last item - no problem.  However, the SnapListener does not fire ever in this scenario.  No matter where you are in the list (first item, middle of the list, last item), the code in GravityDelegate for onScrollStateChanged where it calls getSnappedPosition(recyclerView) returns RecyclerView.NO_POSITION even though the snap is working completely correctly and the item is completely visible.\r\n\r\nExample: Make an item that is 150dp wide, set up your recyclerview like follows:\r\n\r\n    <android.support.v7.widget.RecyclerView\r\n        android:id=\"@+id/myRecyclerview\"\r\n        android:layout_width=\"match_parent\"\r\n        android:layout_height=\"wrap_content\"\r\n        android:paddingStart=\"12dp\"\r\n        android:paddingEnd=\"300dp\"\r\n        android:clipChildren=\"false\"\r\n        android:clipToPadding=\"false\"/>\r\n\r\nSnapping works correctly for all items, SnapListener never fires for any item.\r\n\r\nChange the paddingEnd to be 200, you'll be able to snap to the 2nd to last", "llm": "scroll", "quote": "you can scroll the last item all the way to the start of the view."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/rubensousa/GravitySnapHelper/issues/40", "title": "RecyclerView Auto Scrolling with GravitySnapHelper", "body": "I use RTL horizontal `recyclerview` with `LinearLayoutManager` and set `GravitySnapHelper(Gravity.END)` to it. But after apply a little scroll to left, the recyclerview scrolls to left automatically without any user touches.\r\nI attached a gif following to show the problem:\r\n![2017_12_08_14_58_08](https://user-images.githubusercontent.com/20586723/33764519-e8d25a96-dc29-11e7-8ea6-bcd1b9a8aabc.gif)\r\n", "llm": "scroll", "quote": "after apply a little scroll to left"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/cymcsg/UltimateRecyclerView/issues/466", "title": "java.lang.IndexOutOfBoundsException", "body": "Hello \r\n\r\nI got this error and found a page to explain this error.\r\nBut I don't know how to fix this error.\r\nplz help me\r\n\r\n`java.lang.IndexOutOfBoundsException  \r\nInconsistency detected. Invalid item position 35(offset:35).state:36  \r\n  \r\nandroid.support.v7.widget.RecyclerView$Recycler.getViewForPosition(RecyclerView.java:4041)  \r\nandroid.support.v7.widget.RecyclerView$Recycler.getViewForPosition(RecyclerView.java:3999)  \r\nandroid.support.v7.widget.LayoutState.next(LayoutState.java:83)  \r\nandroid.support.v7.widget.StaggeredGridLayoutManager.fill(StaggeredGridLayoutManager.java:1412)  \r\nandroid.support.v7.widget.StaggeredGridLayoutManager.scrollBy(StaggeredGridLayoutManager.java:1878)  \r\nandroid.support.v7.widget.StaggeredGridLayoutManager.scrollVerticallyBy(StaggeredGridLayoutManager.java:1796)  \r\nandroid.support.v7.widget.RecyclerView.scrollByInternal(RecyclerView.java:1204)  \r\nandroid.support.v7.widget.RecyclerView.onTouchEvent(RecyclerView.java:1951)  \r\nandroid.view.View.dispatchTouchEvent(View.java:8497)`\r\n\r\nhttp://blog.csdn.net/msn465780/article/details/53907772\r\n", "llm": "scroll", "quote": "android.support.v7.widget.RecyclerView.onTouchEvent(RecyclerView.java:1951)\nandroid.support.v7.widget.RecyclerView.scrollByInternal(RecyclerView.java:1204)\nandroid.support.v7.widget.StaggeredGridLayoutManager.scrollVerticallyBy(StaggeredGridLayoutManager.java:1796)"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/vivchar/RendererRecyclerViewAdapter/issues/15", "title": "ViewState not working as expected", "body": "Hi! \r\n\r\nFirst of all i want to thank you for this library! \r\n\r\nI think i encountered a problem with the viewstate. It doesn\u00b4t work like expected and the behaviour can be reproduced with your given example app.\r\n\r\n- run the app\r\n- open view state \r\n- scroll the first item horizontally \r\n- scroll down\r\n=> some elements have the same view state as the first item\r\n\r\nThis behaviour first occured in an example i made:\r\n\r\n- i created a recycler view with switches \r\n- after i opened the fragment i changed the view state of one item\r\n- than i scrolled the view \r\n=> some elements were checked\r\n\r\nThe strange thing: when i first scroll the view and change afterwards the state of the items this bug doesn\u00b4t occure. So i downloaded your example to check if i made something wrong. But also in your example i was able to reproduce this unexpected behaviour. \r\n\r\nMaybe you can try to reproduce this behaviour. Please let me know if im doing something wrong or you have a solution for this problem.\r\n", "llm": "scroll", "quote": "scroll the first item horizontally\n- scroll down"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/a7medev/react-native-ml-kit/issues/45", "title": "Performance degradation in iOS simulator when using MLKit ", "body": "### What happened?\r\n\r\nThis library was easy to install and use, but I noticed that I got a warning that I needed to use Rosetta in order to be compatible with other libraries.\r\n\r\n<img width=\"528\" alt=\"Screenshot 2023-10-31 at 16 46 21\" src=\"https://github.com/a7medev/react-native-ml-kit/assets/120044/7b89740f-0a78-48a7-b98a-043d80e644c8\">\r\n\r\nAdditionally, I noticed there was a slow down in the app when using Rosetta in the Simulator, which makes some sense. I traced the issue back to Google's MLKit Podspec, which is excluding arm64 simulator builds, which means Xcode is forced to use x386 and then use Rosetta for the other libraries.\r\n\r\nhttps://github.com/CocoaPods/Specs/blob/master/Specs/b/e/b/GoogleMLKit/4.0.0/GoogleMLKit.podspec.json#L18\r\n\r\nSince the MLKit Cocoapod would obviously have arm64 support, you can force Cocoapods to not switch the architecture like so:\r\n\r\n```ruby\r\npost_install do |installer|\r\n    # put this at the end of this block\r\n    installer.pods_project.build_configurations.each do |config|\r\n       config.build_settings[\"EXCLUDED_ARCHS[sdk=iphonesimulator*]\"] = \"arm64\"\r\n    end\r\nend\r\n``` \r\n\r\nThis worked - the app built for the simulator without forcing me to use Rosetta. However, the performance degradation still persisted. An example of this is that the frame rate is seriously slow on a table when scrolling.\r\n\r\nThe production build does not appear to have this problem, or at least it is far less so. I'm not sure how to explain this!\r\n\r\n\r\n### Version\r\n\r\nla", "llm": "scroll", "quote": "An example of this is that the frame rate is seriously slow on a table when scrolling."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Yalantis/uCrop/issues/255", "title": "Matrix NPE on newly set image", "body": "Bug\r\n\r\nThe following exception is thrown when touching newly set image\r\n`java.lang.NullPointerException: Attempt to get length of null array\r\n                      at android.graphics.Matrix.mapPoints(Matrix.java:672)\r\n 684alpha\u52a8\u753b\u6709\u5173\u7cfb\r\n    private void addAnimate(SmartViewHolder holder, int position) {\r\n        if (mOpenAnimationEnable && mLastPosition < position) {\r\n            holder.itemView.setAlpha(0);\r\n            holder.itemView.animate().alpha(1).start();\r\n            mLastPosition = position;\r\n        }\r\n    }\r\n\r\n\r\n\u600e\u4e48\u91cd\u73b0\u6ca1\u6709\u8bd5\u51fa\u6765\uff0c\u56e0\u4e3a\u4e00\u822c\u6ca1\u95ee\u9898\u3002\u53d1\u73b0\u4ec0\u4e48\u89c4\u5f8b\u518d\u6c47\u62a5\u4e0b\r\n\r\n\u5e0c\u671b\u8fd8\u662f\u4f5c\u8005\u80fd\u4fee\u6539\u4e0b\r\n\r\n", "llm": "scroll", "quote": "RecyclerView\u67d0\u4e9b\u60c5\u51b5\u4e0b\u6ed1\u52a8\u4f1a\u6d88\u5931\u4e0d\u89c1\uff0c\u4e0d\u9700\u8981\u6ed1\u52a8\u5f88\u5feb\uff0c\u6162\u6162\u6ed1\u52a8\u5c31\u884c"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/miguelhincapie/CustomBottomSheetBehavior/issues/50", "title": "Sliding down from STATE_COLLAPSED does not hide the bottomsheet", "body": "Hi, I would like to know how I can fix this problem.\r\nIf my bottomsheet is currently STATE_COLLAPSED, scrolling down does NOT hide it. \r\nIf my bottomsheet is currently STATE_ANCHOR_POINT, scrolling down ON THE VIEWPAGER will hide it.\r\n\r\nI cloned this sample project and it seems that is has the same issue, even if the bottomsheet is hideable (app:behavior_hideable=\"true\"), on scrolling down by TOUCHING THE VIEWPAGER will hide the bottomsheet. \r\n\r\n", "llm": "scroll", "quote": "scrolling down ON THE VIEWPAGER will hide it."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/miguelhincapie/CustomBottomSheetBehavior/issues/68", "title": "Parallax effect and Merged AppBar problems", "body": "I have had problems with the parallax effect (BackdropBottomSheetBehavior) and the (MergedAppBarLayoutBehavior) in some specific devices: LG K20 Android 7.0 and Samsung Note 8 Android 7.0 The Backdrop element doesn't move always, some times it fr he top even though the recycler view is still scrolled to the bottom."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/noties/Scrollable/issues/35", "title": "Ghost click events propagated to the scrolling view", "body": "If UP event received when `getScrollY()` == mMaxScrollY, click event is propagated to the scrolling view\n", "llm": "scroll", "quote": "If UP event received when `getScrollY()` == mMaxScrollY, click event is propagated to the scrolling view"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/figonzal1/LastQuakeChile/issues/51", "title": "Paginaci\u00f3n fallida despu\u00e9s de recarga manual", "body": "**Pasos para reproducci\u00f3n**\r\n\r\n* Ingresar a listado de sismos.\r\n* Hacer scroll varias veces para cargar varias paginas de la lista.\r\n* Presionar el bot\u00f3n de refresh del listado.\r\n* Continuar haciendo scroll.\r\n\r\n**Problema:**\r\nLa lista carga la pagina 1 y luego carga la pagina en que qued\u00f3 antes del refresco.\r\n\r\n**Soluci\u00f3n:**\r\nReiniciar \u00edndice de paginaci\u00f3n al refrescar la p\u00e1gina.", "llm": "scroll", "quote": "Hacer scroll varias veces para cargar varias paginas de la lista. Continuar haciendo scroll."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/cuore-mm/Slevo/issues/255", "title": "[Bug] \u30b9\u30ec\u30c3\u30c9\u306e\u30c4\u30fc\u30eb\u30d0\u30fc\u306e\u6319\u52d5\u3092\u4fee\u6b63", "body": "- \u6700\u4e0b\u90e8\u307e\u3067\u30b9\u30af\u30ed\u30fc\u30eb\u3057\u305f\u3068\u304d\u306e\u6319\u52d5\u304c\u4e0d\u81ea\u7136", "llm": "scroll", "quote": "\u6700\u4e0b\u90e8\u307e\u3067\u30b9\u30af\u30ed\u30fc\u30eb\u3057\u305f\u3068\u304d\u306e\u6319\u52d5\u304c\u4e0d\u81ea\u7136"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/cuore-mm/Slevo/issues/458", "title": "[Bug] \u30b9\u30ec\u30c3\u30c9\u753b\u9762\u3092\u30b9\u30af\u30ed\u30fc\u30eb\u3057\u3066\u3044\u308b\u3068\u3001\u305f\u30 , "kind": "trigger", "url": "https://github.com/goldy1992/Mp3Player/issues/108", "title": "Resolve notification bar issue", "body": "### **Requirements**\r\n\r\n**WHEN:** player is started\r\n**THEN:** Notification is not displayed (i.e. `playerNotificationManager.setPlayer(null)` on startup)\r\n\r\n**WHEN:** a song if played or resumed:\r\n**THEN:** if notification is not displayed, display it, (i.e. `playerNotificationManager.setPlayer(player)`)\r\n\r\n**WHEN:** media player is playing\r\n**THEN:** notification is active and **cannot** be removed\r\n\r\n**WHEN:** media player is paused\r\n**THEN:** notification can be removed\r\n\r\n**WHEN:** back is pressed on the MainActivity and the app is exited \r\n**AND:** the player is in ANY state\r\n**AND:** The notification is present\r\n**THEN:** The notification is NOT removed\r\n\r\n**WHEN:** The media player is **playing** and the app is removed from the current tasks\r\n**THEN:** The notification is NOT removed\r\n\r\n**WHEN:** The media player is **paused** and the app is removed from the current tasks\r\n**THEN:** The notification is removed", "llm": "swipe", "quote": "WHEN: The media player is playing and the app is removed from the current tasks"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/ltguillaume/droidshows/issues/107", "title": "Pull-down gesture to update TV shows does not work on Android 12", "body": "With the update to Android 12, the gesture \"pull-down to update the TV shows\" does not work anymore.\r\n\r\nWorkaround: Via the context menu (three dots on the right), the same feature works.\r\n\r\nVersion affacted/tested: `7.11.2`", "llm": "swipe", "quote": "the gesture \"pull-down to update the TV shows\" does not work anymore."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Elnix90/Dragon-Launcher/issues/455", "title": "[BUG] open rootnest by default no longer works", "body": "### Requirements\n\n- [x] I have written the whole issue myself and I am not an AI Agent. Check [CONTRIBUTING.MD](https://github.com/Elnix90/Dragon-Launcher?tab=contributing-ov-file) for more info\n- [x] I checked for duplicate issues in both opened and closed\n- [x] I updated the app to the latest version and searched in the whole app / asked if the feature isn't already implemented\n- [ ] I updated the app to the latest beta version to test and searched in the whole app / asked if the feature isn't already implemented\n- [ ] I haven't read those requirements\n\n### Description\n\nswipe nest thinking you're in root nest but you actually arent\n\n### Steps to Reproduce\n\nhave a nest\nopen app\nclose app\nswipe nest thinking you're in root nest but you actually arent\n\n### Expected Behavior\n\nopen in root nest after exiting an app\n\n### Actual Behavior\n\nswipe nest thinking you're in root nest but you actually arent\n\n### Version\n\n4.4.1\n\n### Device and version\n\nGoogle Pixel 8a\nGrapheneOS\nAndroid 17\n\n### Logs\n\n```shell\n\n```\n\n### Additional Context\n\nvideo of bug is in discord server in #feedback ", "llm": "swipe", "quote": "swipe nest thinking you're in root nest but you actually arent"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/EmmaTellblom/Mensinator/issues/183", "title": "Bug: Calendar Selection Persists When Switching Months", "body": "## Description\r\n\r\nCurrently, when a user selects dates in the calendar and then switches to a different month, the selection from the previous month is not cleared. This can lead to unintended behavior:\r\n\r\n- If the user selects dates, switches months, and makes changes (e.g., removes or adds periods, symptoms, or ovulations), the changes also affect the previously selected dates without the user\u2019s knowledge.\r\n\r\n## Steps to Reproduce\r\n\r\n1. Open the calendar in the app.\r\n2. Select one or more dates.\r\n3. Switch to a different month.\r\n4. Make changes (e.g., remove or add periods, symptoms, or ovulations) to the current month.\r\n5. Notice that the changes also affect the dates selected in the previous month.\r\n\r\n## Expected Behavior\r\n\r\n- When switching to a new month, any previously selected dates should be cleared to prevent unintended changes.\r\n\r\n## Actual Behavior\r\n\r\n- Selected dates from the previous month remain active and are affected by changes made in the new month.\r\n\r\n## Proposed Solution\r\n\r\n- Clear the selection automatically when the user switches to a different month.\r\n\r\n## Acceptance Criteria\r\n\r\n- Switching months in the calendar clears any previously selected dates.\r\n- Users can make changes in the new month without unintentionally affecting dates from the previous month.\r\n\r\n## Additional Notes\r\n\r\nThis fix will ensure a smoother user experience and prevent accidental changes to previously selected dates.\r\n", "llm": "swipe", "quote": "Switch to a different month."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/Markel15/FlowState/issues/24", "title": "Flicker of a task initially not visible in the viewport on deletion/completion", "body": "When a task is marked as completed or swiped to delete, if there are items outside the bottom of the viewport, the item entering the screen flickers. It visually moves up correctly to fill the gap, but suddenly teleports back to the bottom bound of the screen and re-animates upwards.\n\nThis issue serves to document the exact root cause of this behavior, which is a structural limitation and architectural clash within Jetpack Compose's LazyColumn internals.\n\nThe Architecture Context. The current setup relies on a combination of:\n\n1. LazyColumn with items wrapper by ReorderableItem (which applies Modifier.animateItem() by default in v3.0.0+).\n2. A local exit animation (AnimatedVisibility with shrinkVertically and fadeOut) inside the AnimatableTaskItem.\n3. A temporal decoupling (e.g., delay(300)) between the start of the visual animation and the actual removal of the data state from the ViewModel \n\n**Root Cause Analysis**\nThe flicker is caused by a responsibility clash between the local size-changing animation (shrinkVertically) and Compose's internal placement tracking (Modifier.animateItem()).\n\nHere is the exact step-by-step breakdown of the engine's failure:\n\n1. The \"Ghost\" Shrink (Data-Visual Desync): When the shrinkVertically animation starts, the LazyColumn naturally pulls the bottom items up into the viewport to fill the shrinking gap. However, because the actual deletion is delayed (delay(300)), the data state remains unchanged. The item moving up retains its original data", "llm": "swipe", "quote": "swiped to delete"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/LanRhyme/ReveriePaint/issues/35", "title": "\u7b14\u5237\u5728\u8c03\u8bd5\u7b14\u5237\u754c\u9762\u7684\u8bd5\u753b\u680f\u662f\u65ad\u5f00\u7684", "body": "<img width=\"1840\" height=\"1212\" alt=\"Image\" src=\"https://github.com/user-attachments/assets/743838ca-d691-4461-931c-f79339bc53fb\" />", "llm": "swipe", "quote": "\u7b14\u5237\u5728\u8c03\u8bd5\u7b14\u5237\u754c\u9762\u7684\u8bd5\u753b\u680f\u662f\u65ad\u5f00\u7684 (The brush is disconnected in the test drawing area of the brush debugging interface)"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/dhilipmpms/NovaDial/issues/84", "title": "Weird behavior when I'm on the call (unable to see Notifications)", "body": "### Checklist\n\n- [x] I can reproduce the bug with the latest version given [here](https://github.com/dhilipmpms/NovaDial/releases/latest).\n- [x] I made sure that there are **no existing issues** - [open](https://github.com/dhilipmpms/NovaDial/issues) or [closed](https://github.com/dhilipmpms/NovaDial/issues?q=is%3Aissue+is%3Aclosed) - to which I could contribute my information.\n- [x] I have read the FAQs inside the app (Menu -> About -> FAQs) and my problem isn't listed.\n- [x] **I have taken the time to fi /crowdin/mobile-sdk-android/issues/220", "title": "Inflating Views using Contexts wrapped by CrowdIn result in Resources$NotFoundExceptions", "body": "**Describe the bug**\r\nWhen using CrowdIn in our app, we've found hundreds of mysterious `android.content.res.Resources$NotFoundException` coming from our WebView and ExoPlayer views we're inflating in our app (our only non-composable views in our app). We tried several approaches to figure out the root cause of these crashes, and were able to determine that CrowdIn's wrapping of our base context that we were then using to inflate these views was the root cause of these crashes. \r\n\r\n\r\n**To Reproduce**\r\nSteps to reproduce the behavior:\r\n1. Set up a project using CrowdIn that wraps the base context when an activity starts up in `attachBaseContext`\r\n2. Inflate a WebView instance programmatically, ie `WebView(context)`\r\n3. Select text on a web page or text input field in order to trigger the system inflating a contextual window pop up (ie, Copy, Paste, etc) via long clicking, or double-tapping text.\r\n4. Observe the web view crash, with a `Resources$NotFoundException`. Exception thrown will be some permutation of this message:\r\n> android.content.res.Resources$NotFoundException - Unable to find resource ID #<address>\r\n5. Comment out lines that wrap the base context `attachBaseContext`\r\n6. Select text in a webview, you should see no crash.\r\n\r\n**Expected behavior**\r\nA view's non-string resources should not be impacted or obstructed by crowd in in any way\r\n\r\n**Screenshots**\r\nN/A\r\n\r\n**Smartphone (please complete the following information):**\r\n- All Android versions we support (Android 8", "llm": "long_press", "quote": "Select text on a web page or text input field in order to trigger the system inflating a contextual window pop up (ie, Copy, Paste, etc) via long clicking, or double-tapping text."}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/PVOT-OSS/Messages/issues/112", "title": "[BUG] Blocking numbers makes the app crash", "body": "## Description\nI Started blocking some old spam numbers through the app. After 2/3 times, the app started crashing each time I block a phone number. I've reinstalled the app and now it crashes every time I block a number.\n\n## **To Reproduce**\nSteps to reproduce the behavior:\n#### 1st Time I found this issue\n1. Select the conversation of the number to block\n2. Open the conversation\n3. Click On '...' & Select block\n4. App Crashes\n#### After Reinstall\n1. Select and hold on a conversation \n2. Select \"Block\" from \"...\" Menu\n3. App Crashes\n\n## **Expected behavior**\nIt should've just blocked the number and then:\n**Either**, delete the conversation & return to Conversations List\n**or**, return back to the conversation and show in that conversation that this number has been blocked.\n\n## **Smartphone:**\n - Device: Motorola Edge 60 Stylus\n - OS: Android 15\n - App Version 1.0.6", "llm": "long_press", "quote": "Select and hold on a conversation"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/ivaniskandar/shouko/issues/41", "title": "Assistant button does nothing if overridden on Andioid 12", "body": "After upgrading my Xperia 5 II XQ-AS52 to Android 12 (58.2.A.0.899), when I hold the assistant button, nothing happens. I get the same results after upgraging to Xperi+ 0.7.0.\r\n\r\nI tried this with the action set to Play/Pause or starting an application.\r\nIf I reset the override setting to default, Google Assistant shows up when I press the button.", "llm": "long_press", "quote": "when I hold the assistant button"}, {"list": "to_verify_sample", "kind": "trigger", "url": "https://github.com/ichenhe/wear-gallery/issues/4", "title": "\u624b\u673a\u7aef\u9009\u4e2d\u4e2a\u6570\u4e0d\u6b63\u786e", "body": "- [x] \u6211\u5df2\u786e\u8ba4\u624b\u673a\u4e0e\u624b\u8868\u5e94\u7528\u7248\u672c\u76f8\u540c\u3002\r\n- [x] \u6211\u5df2\u7ecf\u7ed9\u4e88\u
